<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live2D 模型展示 - PixiJS 版本</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            /* 关键：强制透明 */
            background-color: transparent !important;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 600px;
            max-width: 900px;
            height: 600px;
            border: 1px solid red;
            background-image: url('../../src/assets/image/manbgc.png');
            background-repeat: no-repeat;
            background-position: center;
            background-size: auto;
            border-radius: 20px;
            /* 移除模糊，因为它需要背景色才能生效，且会干扰透明 */
            /* backdrop-filter: blur(10px); */
            box-shadow: none;
            /* 建议移除阴影，除非你确定它不会导致黑边 */
            overflow: hidden;
        }

        #canvas {
            width: 100%;
            height: 100%;
            cursor: pointer;
            /* 关键：Canvas 自身透明 */
            background: transparent;
            display: block;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 10px;
            z-index: 100;
        }

        .btn {
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.95);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            color: #667eea;
        }

        .btn:hover {
            background: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .model-selector {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
        }

        select {
            padding: 12px 20px;
            border-radius: 10px;
            border: none;
            background: rgba(255, 255, 255, 0.95);
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            color: #667eea;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 20px;
            font-weight: bold;
            display: none;
            z-index: 200;
            text-align: center;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        h1 {
            color: white;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            font-size: 32px;
        }

        .info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 13px;
            max-width: 280px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            z-index: 100;
        }

        .info-panel h3 {
            margin-bottom: 10px;
            color: #667eea;
            font-size: 16px;
        }

        .info-panel p {
            margin: 6px 0;
            color: #333;
            line-height: 1.5;
        }

        .status-bar {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 100;
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <canvas id="canvas"></canvas>


        <div class="loading" id="loading">
            <div class="loading-spinner"></div>
            <div>正在加载模型...</div>
        </div>

        <div class="status-bar" id="statusBar"></div>

        <!-- <div class="info-panel">
            <h3>✨ 使用说明</h3>
            <p>• 点击画布播放随机动作</p>
            <p>• 鼠标移动跟踪视角</p>
            <p>• 使用下方按钮控制</p>
            <p>• 右上角切换模型</p>
        </div> -->

        <div class="model-selector">
            <select id="modelSelect">
                <option value="Mao">Mao</option>
                <option value="asuka">Asuka</option>
                <option value="huohuo">Huohuo</option>
                <option value="icegirl">Ice Girl</option>
                <option value="haihupu">Haihupu</option>
                <option value="pachan">Pachan</option>
                <option value="ren_pro_zh">Haru Greeter Pro JP</option>
            </select>
        </div>

        <div class="controls">
            <button class="btn" onclick="playRandomMotion()">🎬 随机动作</button>
            <button class="btn" onclick="playRandomExpression()">😊 随机表情</button>
            <button class="btn" onclick="resetModel()">🔄 重置</button>
            <button class="btn" onclick="toggleAutoBreath()">💨 自动呼吸</button>
        </div>
    </div>

    <!-- Live2D Cubism Core (必须最先加载) -->
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>

    <!-- PixiJS -->
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.x/dist/pixi.min.js"></script>

    <!-- pixi-live2d-display (Cubism 4) -->
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>

    <!-- 主脚本 -->
    <script src="./app.js?v=9"></script>
</body>

</html>
