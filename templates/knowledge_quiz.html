<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识点盘问</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
       background: #f0f2f5; color: #1a1a2e; min-height: 100vh; }

/* ===== Header ===== */
.header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
           color: #fff; padding: 20px 40px; display: flex; align-items: center;
           justify-content: space-between; }
.header h1 { font-size: 24px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
.header .user-info { display: flex; align-items: center; gap: 12px; }
.header .user-info input { padding: 8px 14px; border: none; border-radius: 8px;
                           background: rgba(255,255,255,0.2); color: #fff;
                           font-size: 14px; width: 200px; outline: none; }
.header .user-info input::placeholder { color: rgba(255,255,255,0.6); }
.header .user-info button { padding: 8px 18px; border: none; border-radius: 8px;
                            background: rgba(255,255,255,0.25); color: #fff;
                            cursor: pointer; font-size: 14px; transition: all .2s; }
.header .user-info button:hover { background: rgba(255,255,255,0.35); }

/* ===== Views ===== */
.view { display: none; }
.view.active { display: block; }

.container { max-width: 1000px; margin: 0 auto; padding: 24px 16px; }

/* ===== Knowledge Point List ===== */
.page-title { font-size: 20px; font-weight: 600; margin-bottom: 16px; color: #333; }
.page-subtitle { font-size: 14px; color: #888; margin-bottom: 20px; }

.kp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
           gap: 16px; }
.kp-card { background: #fff; border-radius: 12px; padding: 20px;
           cursor: pointer; transition: all .25s; border: 2px solid transparent;
           position: relative; overflow: hidden; }
.kp-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.1);
                 border-color: #667eea; }
.kp-card .name { font-size: 16px; font-weight: 600; margin-bottom: 8px;
                 display: flex; align-items: center; gap: 8px; }
.kp-card .name .tag { font-size: 11px; padding: 2px 8px; border-radius: 10px;
                       font-weight: 500; }
.tag-unresolved { background: #fee2e2; color: #dc2626; }
.tag-resolved { background: #dcfce7; color: #16a34a; }
.tag-new { background: #e0e7ff; color: #4f46e5; }

.kp-card .stats { display: flex; gap: 16px; margin: 10px 0; font-size: 13px; color: #666; }
.kp-card .stats span { display: flex; align-items: center; gap: 4px; }

.kp-card .mastery-bar { height: 6px; background: #e5e7eb; border-radius: 3px;
                         margin-top: 10px; overflow: hidden; }
.kp-card .mastery-fill { height: 100%; border-radius: 3px; transition: width .5s; }
.fill-low { background: linear-gradient(90deg, #ef4444, #f97316); }
.fill-mid { background: linear-gradient(90deg, #f97316, #eab308); }
.fill-high { background: linear-gradient(90deg, #22c55e, #10b981); }

.kp-card .mastery-label { font-size: 12px; color: #999; margin-top: 6px;
                           display: flex; justify-content: space-between; }

.kp-card .enter-btn { position: absolute; right: 16px; bottom: 16px;
                       padding: 6px 16px; border: none; border-radius: 8px;
                       background: linear-gradient(135deg, #667eea, #764ba2);
                       color: #fff; font-size: 13px; cursor: pointer; opacity: 0;
                       transition: opacity .25s; }
.kp-card:hover .enter-btn { opacity: 1; }

.kp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }

/* Tabs */
.tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.tab-btn { padding: 8px 18px; border: 1px solid #e5e7eb; border-radius: 20px;
           background: #fff; color: #666; font-size: 13px; cursor: pointer;
           transition: all .2s; white-space: nowrap; }
.tab-btn:hover { border-color: #667eea; color: #667eea; }
.tab-btn.active { background: linear-gradient(135deg, #667eea, #764ba2);
                  color: #fff; border-color: transparent; }
.tab-btn .cnt { font-size: 11px; opacity: 0.8; margin-left: 4px; }

.empty-state { text-align: center; padding: 60px 20px; color: #999; }
.empty-state .icon { font-size: 48px; margin-bottom: 16px; }

/* ===== Interrogation View ===== */
.interrogation-view { display: flex; flex-direction: column; min-height: calc(100vh - 80px); }
.quiz-header { background: #fff; border-radius: 12px; padding: 20px 24px;
               margin-bottom: 16px; display: flex; align-items: center;
               justify-content: space-between; }
.quiz-header .kp-title { font-size: 18px; font-weight: 600; color: #333; }
.quiz-header .round-info { font-size: 14px; color: #888; }
.quiz-header .back-btn { padding: 8px 16px; border: 1px solid #ddd; border-radius: 8px;
                          background: #fff; cursor: pointer; font-size: 13px;
                          color: #666; transition: all .2s; }
.quiz-header .back-btn:hover { border-color: #667eea; color: #667eea; }

/* Chat messages */
.chat-area { flex: 1; max-height: 500px; overflow-y: auto; padding: 8px 0;
             margin-bottom: 16px; }
.chat-area::-webkit-scrollbar { width: 6px; }
.chat-area::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

.msg { margin-bottom: 20px; display: flex; gap: 12px; }
.msg.system { justify-content: flex-start; }
.msg.user { justify-content: flex-end; }

.msg .bubble { max-width: 75%; padding: 14px 18px; border-radius: 16px;
               font-size: 14px; line-height: 1.6; position: relative; }
.msg.system .bubble { background: #fff; color: #333; border: 1px solid #e5e7eb;
                       border-bottom-left-radius: 4px; }
.msg.user .bubble { background: linear-gradient(135deg, #667eea, #764ba2);
                     color: #fff; border-bottom-right-radius: 4px; }

.msg .avatar { width: 36px; height: 36px; border-radius: 50%;
               display: flex; align-items: center; justify-content: center;
               font-size: 16px; flex-shrink: 0; }
.msg.system .avatar { background: #e0e7ff; color: #4f46e5; }
.msg.user .avatar { background: #ede9fe; color: #7c3aed; }

.scenario-box { background: #f0f4ff; border-left: 3px solid #667eea;
                border-radius: 8px; padding: 12px 16px; margin: 8px 0;
                font-size: 13px; color: #555; }
.scenario-box .label { font-weight: 600; color: #4f46e5; margin-bottom: 4px; }

.evaluation-box { background: #f8fafc; border-radius: 8px; padding: 12px 16px;
                  margin: 8px 0; font-size: 13px; border: 1px solid #e5e7eb; }
.evaluation-box .score { display: inline-flex; align-items: center; gap: 6px;
                          padding: 2px 10px; border-radius: 12px; font-weight: 600;
                          font-size: 13px; }
.score-good { background: #dcfce7; color: #16a34a; }
.score-ok { background: #fef9c3; color: #ca8a04; }
.score-bad { background: #fee2e2; color: #dc2626; }

.hint-box { background: #fefce8; border-radius: 8px; padding: 10px 14px;
            margin: 8px 0; font-size: 13px; color: #a16207; border: 1px solid #fde68a; }
.hint-box .label { font-weight: 600; }

/* Input area */
.input-area { background: #fff; border-radius: 12px; padding: 16px 20px;
              display: flex; gap: 12px; align-items: flex-end; }
.input-area textarea { flex: 1; border: 1px solid #e5e7eb; border-radius: 10px;
                       padding: 12px 16px; font-size: 14px; resize: none;
                       outline: none; min-height: 48px; max-height: 120px;
                       font-family: inherit; line-height: 1.5; }
.input-area textarea:focus { border-color: #667eea; }
.input-area .send-btn { padding: 10px 24px; border: none; border-radius: 10px;
                        background: linear-gradient(135deg, #667eea, #764ba2);
                        color: #fff; font-size: 14px; cursor: pointer; white-space: nowrap;
                        transition: opacity .2s; height: 48px; }
.input-area .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* Mic button */
.input-area .mic-btn { width: 48px; height: 48px; border: none; border-radius: 50%;
                       background: #f3f4f6; color: #555; cursor: pointer;
                       font-size: 20px; display: flex; align-items: center;
                       justify-content: center; transition: all .2s; flex-shrink: 0; }
.input-area .mic-btn:hover { background: #e5e7eb; }
.input-area .mic-btn.recording { background: #fee2e2; color: #dc2626;
                                 animation: pulse 1s infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

/* Image upload button */
.input-area .img-btn { width: 48px; height: 48px; border: none; border-radius: 50%;
                       background: #f3f4f6; color: #555; cursor: pointer;
                       font-size: 20px; display: flex; align-items: center;
                       justify-content: center; transition: all .2s; flex-shrink: 0; }
.input-area .img-btn:hover { background: #e5e7eb; }
#imageInput { display: none; }

/* Image preview */
.img-preview { max-width: 200px; max-height: 150px; border-radius: 8px;
               border: 1px solid #e5e7eb; margin-top: 6px; cursor: pointer; }

/* ===== Result View ===== */
.result-view { max-width: 1000px; margin: 0 auto; padding: 24px 16px; }

.result-header { text-align: center; padding: 32px 20px; background: #fff;
                 border-radius: 16px; margin-bottom: 24px; }
.result-header .verdict-badge { display: inline-flex; align-items: center; gap: 8px;
                                 padding: 8px 24px; border-radius: 24px; font-size: 18px;
                                 font-weight: 600; margin-bottom: 12px; }
.verdict-mastered { background: linear-gradient(135deg, #dcfce7, #bbf7d0);
                    color: #15803d; }
.verdict-basic { background: linear-gradient(135deg, #fef9c3, #fde68a);
                 color: #854d0e; }
.verdict-not { background: linear-gradient(135deg, #fee2e2, #fecaca);
               color: #b91c1c; }

.result-header .summary { font-size: 15px; color: #666; max-width: 600px; margin: 0 auto; }
.result-header .overall-score { font-size: 48px; font-weight: 700; margin: 8px 0; }

.charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
              margin-bottom: 24px; }
.chart-card { background: #fff; border-radius: 12px; padding: 20px;
              min-height: 380px; }
.chart-card .chart-title { font-size: 15px; font-weight: 600; color: #333;
                            margin-bottom: 12px; display: flex; align-items: center;
                            gap: 6px; }
.chart-card .chart-container { width: 100%; height: 320px; }

.dimension-summary { background: #fff; border-radius: 12px; padding: 24px;
                     margin-bottom: 24px; }
.dimension-summary h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px;
                         color: #333; }
.dim-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.dim-item { text-align: center; padding: 16px; background: #f8fafc;
            border-radius: 10px; }
.dim-item .dim-name { font-size: 13px; color: #888; margin-bottom: 4px; }
.dim-item .dim-score { font-size: 28px; font-weight: 700; }
.dim-item .dim-bar { height: 4px; background: #e5e7eb; border-radius: 2px;
                      margin-top: 8px; overflow: hidden; }
.dim-item .dim-fill { height: 100%; border-radius: 2px; transition: width .5s; }

.suggestions { background: #fff; border-radius: 12px; padding: 24px;
               margin-bottom: 24px; }
.suggestions h3 { font-size: 16px; font-weight: 600; margin-bottom: 12px;
                   color: #333; }
.suggestions ul { list-style: none; }
.suggestions li { padding: 10px 14px; margin-bottom: 8px;
                  background: #f8fafc; border-radius: 8px; font-size: 14px;
                  color: #555; border-left: 3px solid #667eea; }

.result-actions { text-align: center; margin-top: 16px; }
.result-actions button { padding: 10px 28px; border: none; border-radius: 10px;
                          font-size: 14px; cursor: pointer; margin: 0 8px;
                          transition: all .2s; }
.result-actions .back-list-btn { background: #f3f4f6; color: #555;
                                  border: 1px solid #e5e7eb; }
.result-actions .back-list-btn:hover { background: #e5e7eb; }
.result-actions .retry-btn { background: linear-gradient(135deg, #667eea, #764ba2);
                              color: #fff; }
.result-actions .retry-btn:hover { opacity: 0.9; }

/* ===== Loading ===== */
.loading { display: flex; align-items: center; justify-content: center;
           padding: 40px; gap: 12px; color: #888; }
.spinner { width: 24px; height: 24px; border: 3px solid #e5e7eb;
           border-top-color: #667eea; border-radius: 50%; animation: spin .6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== Responsive ===== */
@media (max-width: 768px) {
  .kp-grid { grid-template-columns: 1fr; }
  .charts-row { grid-template-columns: 1fr; }
  .dim-grid { grid-template-columns: 1fr; }
  .header { flex-direction: column; gap: 12px; padding: 16px; }
  .header .user-info { width: 100%; }
  .header .user-info input { flex: 1; }
}
</style>
</head>
<body>

<div class="header">
  <h1>知识点盘问</h1>
  <div class="user-info">
    <input id="userIdInput" type="text" placeholder="输入用户ID..." value="user_001">
    <button onclick="loadKnowledgePoints()">查询知识点</button>
  </div>
</div>

<!-- ===== View 1: Knowledge Point List ===== -->
<div id="kpListView" class="view active">
  <div class="container">
    <div class="page-title">待盘问知识点</div>
    <div class="page-subtitle">基于错题知识点提取，点击进入盘问以评估实际掌握程度</div>
    <div style="margin-bottom:16px;">
      <div onclick="startImageSolve()" style="display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border:2px dashed #667eea;border-radius:12px;background:#f8f9ff;cursor:pointer;transition:all .2s;"
           onmouseover="this.style.background='#eef0ff'" onmouseout="this.style.background='#f8f9ff'">
        <span style="font-size:20px;">🖼️</span>
        <div>
          <div style="font-size:14px;font-weight:600;color:#667eea;">图像解题</div>
          <div style="font-size:12px;color:#888;">上传题目图片，AI 分析解答</div>
        </div>
        <span style="font-size:18px;color:#667eea;">→</span>
      </div>
    </div>
    <div class="tabs" id="statusTabs"></div>
    <div class="kp-grid" id="kpGrid"></div>
  </div>
</div>

<!-- ===== View 2: Interrogation ===== -->
<div id="interrogationView" class="view">
  <div class="container interrogation-view">
    <div class="quiz-header">
      <div>
        <div class="kp-title" id="quizKpTitle">知识点</div>
        <div class="round-info" id="quizRoundInfo"></div>
      </div>
      <button class="back-btn" onclick="backToList()">← 返回列表</button>
    </div>
    <div class="chat-area" id="chatArea"></div>
    <div class="input-area" id="inputArea">
      <input type="file" id="imageInput" accept="image/*" onchange="onImageSelected(event)">
      <textarea id="answerInput" rows="2" placeholder="输入你的回答..." disabled
                onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();submitAnswer()}"></textarea>
      <button class="img-btn" id="imgBtn" onclick="document.getElementById('imageInput').click()" disabled title="上传图片">🖼️</button>
      <button class="mic-btn" id="micBtn" onclick="toggleRecording()" disabled title="语音输入">🎤</button>
      <button class="send-btn" id="sendBtn" onclick="submitAnswer()" disabled>发送</button>
    </div>
    <div id="imagePreviewArea" style="padding:8px 20px;display:none;"></div>
  </div>
</div>

<!-- ===== View 3: Result ===== -->
<div id="resultView" class="view">
  <div class="result-view" id="resultContent"></div>
</div>

<script>
// ==================== State ====================
let state = {
  userId: 'user_001',
  editingUserId: 'user_001',
  sessionId: null,
  imageSessionId: null,  // 图像解题会话ID
  knowledgePoint: null,
  currentRound: 0,
  totalRounds: 3,
  isFinal: false,
  loading: false,
  mode: 'quiz',  // 'quiz' | 'image'
};

// ==================== Navigation ====================
function showView(viewId) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(viewId).classList.add('active');
}

function backToList() {
  showView('kpListView');
  loadKnowledgePoints();
}

// ==================== Knowledge Point List ====================

let _allKps = [];
let _activeStatus = 'all';

async function loadKnowledgePoints() {
  const userId = document.getElementById('userIdInput').value.trim();
  if (!userId) {
    document.getElementById('kpGrid').innerHTML = '<div class="empty-state"><div class="icon">🔍</div><div>请输入用户ID</div></div>';
    return;
  }
  state.userId = userId;

  const grid = document.getElementById('kpGrid');
  grid.innerHTML = '<div class="loading"><div class="spinner"></div>加载知识点列表...</div>';

  try {
    const resp = await fetch(`/api/knowledge-points/${encodeURIComponent(userId)}`);
    const data = await resp.json();
    if (!data.success) { grid.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><div>${data.detail || '加载失败'}</div></div>`; return; }

    _allKps = data.knowledge_points || [];
    if (_allKps.length === 0) {
      grid.innerHTML = '<div class="empty-state"><div class="icon">📚</div><div>暂无知识点数据，请先做一些错题</div></div>';
      return;
    }

    // 统计各状态数量
    const counts = { all: _allKps.length };
    for (const kp of _allKps) {
      const s = kp.status || 'unpracticed';
      counts[s] = (counts[s] || 0) + 1;
    }

    // 渲染 tab
    const tabDefs = [
      { key: 'all', label: '全部', icon: '�' },
      { key: 'struggling', label: '需巩固', icon: '📌' },
      { key: 'unpracticed', label: '待盘问', icon: '📝' },
      { key: 'new', label: '新知识点', icon: '🌟' },
      { key: 'mastered', label: '已掌握', icon: '✅' },
    ];
    document.getElementById('statusTabs').innerHTML = tabDefs.map(t =>
      `<button class="tab-btn ${_activeStatus === t.key ? 'active' : ''}"
               onclick="switchStatusTab('${t.key}')">${t.icon} ${t.label}
         <span class="cnt">(${counts[t.key] || 0})</span>
       </button>`
    ).join('');

    renderKpList();
  } catch (e) {
    grid.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><div>网络错误: ${e.message}</div></div>`;
  }
}

function switchStatusTab(status) {
  _activeStatus = status;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.tab-btn[onclick*="'${status}'"]`).classList.add('active');
  renderKpList();
}

function renderKpList() {
  const grid = document.getElementById('kpGrid');
  const filtered = _activeStatus === 'all'
    ? _allKps
    : _allKps.filter(kp => (kp.status || 'unpracticed') === _activeStatus);

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty-state"><div class="icon">📚</div><div>该分类下暂无知识点</div></div>';
    return;
  }

  grid.innerHTML = filtered.map(kp => renderKpCard(kp)).join('');
}

function renderKpCard(kp) {
  const ir = kp.interrogation;
  const fillClass = kp.expected_mastery_score < 30 ? 'fill-low' : kp.expected_mastery_score < 60 ? 'fill-mid' : 'fill-high';
  const scoreColor = kp.expected_mastery_score < 40 ? '#ef4444' : kp.expected_mastery_score < 70 ? '#eab308' : '#22c55e';

  // 状态标签
  let tagHtml = '';
  if (kp.has_unresolved) tagHtml = '<span class="tag tag-unresolved">待巩固</span>';
  else if (kp.wrong_count === 0) tagHtml = '<span class="tag tag-new">未练习</span>';
  else tagHtml = '<span class="tag tag-resolved">已巩固</span>';

  // 盘问结果徽标
  let interrogationHtml = '';
  if (ir) {
    const bc = ir.overall_score >= 75 ? '#16a34a' : ir.overall_score >= 50 ? '#ca8a04' : '#dc2626';
    interrogationHtml = `<div style="margin-top:8px;font-size:12px;color:${bc};display:flex;align-items:center;gap:6px;">
      <span>盘问结果:</span>
      <span style="padding:1px 8px;border-radius:8px;background:${bc}15;font-weight:600;">${escapeHtml(ir.verdict_label)} (${ir.overall_score}分)</span>
    </div>`;
  }

  return `<div class="kp-card" onclick="startQuiz('${escapeStr(kp.knowledge_point)}')">
    <div class="name">${escapeHtml(kp.knowledge_point)} ${tagHtml}</div>
    <div class="stats">
      <span>📝 错题 ${kp.wrong_count} 次</span>
      <span>📊 最高连续错 ${kp.max_attempt} 次</span>
      <span>🎯 掌握 ${kp.mastery_label}</span>
    </div>
    <div class="mastery-bar"><div class="mastery-fill ${fillClass}" style="width:${kp.expected_mastery_score}%"></div></div>
    <div class="mastery-label">
      <span>预期掌握度</span>
      <span style="color:${scoreColor};font-weight:600;">${kp.expected_mastery_score}分</span>
    </div>
    ${interrogationHtml}
    <button class="enter-btn">${ir ? '重新盘问 →' : '开始盘问 →'}</button>
  </div>`;
}

// ==================== Start Image Solve ====================
async function startImageSolve() {
  state.mode = 'image';
  state.knowledgePoint = '图像解题';
  state.sessionId = null;

  // 生成客户端会话 ID（首次发送消息时后端自动创建会话）
  state.imageSessionId = 'imgc_' + Math.random().toString(36).substr(2, 12);

  document.getElementById('quizKpTitle').textContent = '🖼️ 图像解题';
  document.getElementById('quizRoundInfo').textContent = '图像解题模式 · 支持上下文追问';
  document.getElementById('chatArea').innerHTML = `
    <div class="msg system">
      <div class="avatar">🤖</div>
      <div class="bubble">
        <div style="font-size:15px;font-weight:500;margin-bottom:8px;">🖼️ 图像解题模式</div>
        <div style="font-size:13px;color:#555;line-height:1.6;">
          可以上传题目图片（代码截图、手写笔记、题目照片等），AI 将自动分析并给出解答。
          <br><strong>支持多轮追问</strong>：分析完图片后，还可以继续输入文字进行追问，AI 会结合之前的上下文回答你。
          <br>也可以直接输入文字提问。

  document.getElementById('answerInput').disabled = false;

}

// ==================== Start Quiz ====================
async function startQuiz(knowledgePoint) {
  state.mode = 'quiz';
  state.knowledgePoint = knowledgePoint;
  state.sessionId = null;
  state.currentRound = 0;
  state.isFinal = false;

  // Switch to interrogation view
  document.getElementById('quizKpTitle').textContent = `盘问: ${knowledgePoint}`;
  document.getElementById('quizRoundInfo').textContent = '准备中...';
  document.getElementById('chatArea').innerHTML =
    '<div class="loading"><div class="spinner"></div>正在生成第1轮场景题...</div>';
  document.getElementById('answerInput').disabled = true;
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('micBtn').disabled = true;
  document.getElementById('imgBtn').disabled = true;
  showView('interrogationView');

  try {
    const resp = await fetch('/api/interrogation/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_id: state.userId, knowledge_point: knowledgePoint }),
    });
    const data = await resp.json();
    if (!data.success) {
      document.getElementById('chatArea').innerHTML =
        `<div class="empty-state"><div class="icon">⚠️</div><div>${data.detail || '启动失败'}</div></div>`;
      return;
    }

    state.sessionId = data.session_id;
    state.totalRounds = data.total_rounds || 3;

    // Clear and show first question
    renderQuestion(data);
  } catch (e) {
    document.getElementById('chatArea').innerHTML =
      `<div class="empty-state"><div class="icon">⚠️</div><div>网络错误: ${e.message}</div></div>`;
  }
}

// ==================== Submit Answer ====================
async function submitAnswer() {
  const input = document.getElementById('answerInput');
  const answerText = input.value.trim();
  const hasImage = _selectedImageFile !== null;

  if ((!answerText && !hasImage) || state.loading) return;
  if (state.mode === 'quiz' && !state.sessionId) return;

  state.loading = true;
  input.disabled = true;
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('imgBtn').disabled = true;

  // ★★★ 图像解题模式：走会话式上下文追问（复用 analyze-image 接口）★★★
  if (state.mode === 'image') {
    if (!state.imageSessionId) {
      appendSystemMessage('⚠️ 会话ID无效，请刷新重试');
      state.loading = false;
      return;
    }

    const chatArea = document.getElementById('chatArea');

    // 显示用户消息
    const userMsg = document.createElement('div');
    userMsg.className = 'msg user';
    let userContent = '';
    if (answerText) userContent += escapeHtml(answerText);
    if (hasImage) {
      const reader = new FileReader();
      const imgDataUrl = await new Promise(resolve => {
        reader.onload = e => resolve(e.target.result);
        reader.readAsDataURL(_selectedImageFile);
      });
      if (userContent) userContent += '<br>';
      userContent += `<img src="${imgDataUrl}" style="max-width:300px;border-radius:8px;">`;
    }
    userMsg.innerHTML = `<div class="avatar">👤</div><div class="bubble">${userContent}</div>`;
    chatArea.appendChild(userMsg);

    // 显示分析中
    appendSystemMessage('⏳ 思考中...');

    // 构建 FormData（复用原有的 analyze-image 接口）
    const formData = new FormData();
    formData.append('session_id', state.imageSessionId);
    formData.append('question', answerText || '');
    if (hasImage) {
      formData.append('file', _selectedImageFile);
    }

    try {
      const resp = await fetch('/api/interrogation/analyze-image', {
        method: 'POST', body: formData,
      });
      const data = await resp.json();

      // 移除"思考中"
      chatArea.removeChild(chatArea.lastChild);

      if (data.success && data.analysis) {
        const replyMsg = document.createElement('div');
        replyMsg.className = 'msg system';
        replyMsg.innerHTML = `<div class="avatar">🤖</div><div class="bubble">
          <div style="font-size:14px;line-height:1.7;color:#333;white-space:pre-wrap;">${escapeHtml(data.analysis)}</div>
        </div>`;
        chatArea.appendChild(replyMsg);
      } else {
        appendSystemMessage(`⚠️ 处理失败: ${data.detail || '未知错误'}`);
      }
    } catch (e) {
      chatArea.removeChild(chatArea.lastChild);
      appendSystemMessage(`⚠️ 网络错误: ${e.message}`);
    }
    clearImage();
    input.value = '';
    state.loading = false;
    input.disabled = false;
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('imgBtn').disabled = false;
    chatArea.scrollTop = chatArea.scrollHeight;
    return;
  }

  // ========== 追问模式（默认）：走 Agent 评估 ==========
  let finalAnswer = answerText;

  // 如果有图片，先分析再合并到回答中
  if (hasImage) {
    const imageMsg = document.createElement('div');
    imageMsg.className = 'msg user';
    const reader = new FileReader();
    const imgDataUrl = await new Promise(resolve => {
      reader.onload = e => resolve(e.target.result);
      reader.readAsDataURL(_selectedImageFile);
    });
    imageMsg.innerHTML = `<div class="avatar">👤</div><div class="bubble">
      ${answerText ? escapeHtml(answerText) + '<br>' : ''}
      <img src="${imgDataUrl}" style="max-width:200px;border-radius:8px;margin-top:4px;">
    </div>`;
    document.getElementById('chatArea').appendChild(imageMsg);

    // 显示分析中
    const chatArea = document.getElementById('chatArea');
    const loadingDiv = document.createElement('div');
    loadingDiv.className = 'msg system';
    loadingDiv.id = 'loadingMsg';
    loadingDiv.innerHTML = '<div class="avatar">🤖</div><div class="bubble"><div class="loading" style="padding:8px"><div class="spinner"></div>分析图片中...</div></div>';
    chatArea.appendChild(loadingDiv);
    chatArea.scrollTop = chatArea.scrollHeight;

    const formData = new FormData();
    formData.append('file', _selectedImageFile);
    formData.append('knowledge_point', state.knowledgePoint || '');
    formData.append('question', answerText || '请分析这张图片');

    try {
      const resp = await fetch('/api/interrogation/analyze-image', {
        method: 'POST', body: formData,
      });
      const data = await resp.json();
      document.getElementById('loadingMsg')?.remove();
      if (data.success && data.analysis) {
        finalAnswer = (answerText ? answerText + '\n\n' : '') + '[图片分析结果]\n' + data.analysis;
      } else {
        finalAnswer = answerText || '[图片上传失败]';
      }
    } catch (e) {
      document.getElementById('loadingMsg')?.remove();
      finalAnswer = answerText || '[图片分析异常]';
    }
    clearImage();
    input.value = '';
  } else {
    appendUserMessage(answerText);
    input.value = '';
  }

  // 显示评估中
  const chatArea = document.getElementById('chatArea');
  const loadingDiv = document.createElement('div');
  loadingDiv.className = 'msg system';
  loadingDiv.id = 'loadingMsg';
  loadingDiv.innerHTML = '<div class="avatar">🤖</div><div class="bubble"><div class="loading" style="padding:8px"><div class="spinner"></div>评估中...</div></div>';
  chatArea.appendChild(loadingDiv);
  chatArea.scrollTop = chatArea.scrollHeight;

  try {
    const resp = await fetch('/api/interrogation/answer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: state.sessionId, answer: finalAnswer }),
    });
    const data = await resp.json();
    if (!data.success) {
      document.getElementById('loadingMsg')?.remove();
      appendSystemMessage(`⚠️ 提交失败: ${data.detail || '未知错误'}`);
      input.disabled = false;
      document.getElementById('sendBtn').disabled = false;
      document.getElementById('micBtn').disabled = false;
      document.getElementById('imgBtn').disabled = false;
      state.loading = false;
      return;
    }

    // Remove loading
    document.getElementById('loadingMsg')?.remove();

    if (data.is_final) {
      state.isFinal = true;
      // Show final evaluation
      appendSystemMessage('📊 盘问结束，正在生成评估报告...');
      // Short delay then show results
      setTimeout(() => showResult(data), 800);
    } else {
      // Show evaluation then next question
      renderEvaluationAndNext(data);
    }
  } catch (e) {
    document.getElementById('loadingMsg')?.remove();
    appendSystemMessage(`⚠️ 网络错误: ${e.message}`);
    input.disabled = false;
    document.getElementById('sendBtn').disabled = false;
  }
  state.loading = false;
}

// ==================== Helpers ====================

function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function escapeStr(text) {
  if (!text) return '';
  return text.replace(/['\\]/g, '\\$&');
}

// ==================== Voice Recording ====================

let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;

async function toggleRecording() {
  if (isRecording) {
    stopRecording();
    return;
  }
  await startRecording();
}

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];

    mediaRecorder.ondataavailable = (event) => {
      if (event.data.size > 0) audioChunks.push(event.data);
    };

    mediaRecorder.onstop = async () => {
      // Stop all tracks
      stream.getTracks().forEach(t => t.stop());

      const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
      if (audioBlob.size < 100) return;

      // Upload and transcribe
      const micBtn = document.getElementById('micBtn');
      micBtn.textContent = '⏳';
      micBtn.disabled = true;

      try {
        const formData = new FormData();
        formData.append('file', audioBlob, 'recording.webm');

        const resp = await fetch('/speech/recognize', {
          method: 'POST',
          body: formData,
        });
        const data = await resp.json();

        if (data.success && data.text) {
          const input = document.getElementById('answerInput');
          input.value = data.text;
          // Auto-submit if text is non-empty
          if (data.text.trim()) {
            await submitAnswer();
          }
        } else {
          appendSystemMessage(`⚠️ 语音识别失败: ${data.message || '未知错误'}`);
        }
      } catch (e) {
        appendSystemMessage(`⚠️ 语音识别网络错误: ${e.message}`);
      } finally {
        micBtn.textContent = '🎤';
        micBtn.disabled = false;
        isRecording = false;
      }
    };

    mediaRecorder.start();
    isRecording = true;
    document.getElementById('micBtn').classList.add('recording');
    document.getElementById('micBtn').textContent = '⏹';

    // Auto-stop after 30 seconds
    setTimeout(() => {
      if (isRecording) stopRecording();
    }, 30000);

  } catch (e) {
    appendSystemMessage(`⚠️ 无法访问麦克风: ${e.message}`);
  }
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
  document.getElementById('micBtn').classList.remove('recording');
  document.getElementById('micBtn').textContent = '🎤';
  isRecording = false;
}

// ==================== Image Upload & Analysis ====================

let _selectedImageFile = null;

function onImageSelected(event) {
  const file = event.target.files[0];
  if (!file) return;
  _selectedImageFile = file;

  // Show preview
  const reader = new FileReader();
  reader.onload = function(e) {
    const area = document.getElementById('imagePreviewArea');
    area.innerHTML = `<div style="display:flex;align-items:center;gap:10px;">
      <img src="${e.target.result}" class="img-preview" onclick="window.open(this.src)">
      <span style="font-size:12px;color:#888;">${file.name}</span>
      <button onclick="clearImage()" style="border:none;background:none;cursor:pointer;color:#dc2626;font-size:16px;">✕</button>
      <button onclick="analyzeImage()" style="padding:6px 14px;border:none;border-radius:8px;
        background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;cursor:pointer;font-size:13px;">分析图片</button>
    </div>`;
    area.style.display = 'block';
  };
  reader.readAsDataURL(file);
}

function clearImage() {
  _selectedImageFile = null;
  document.getElementById('imagePreviewArea').style.display = 'none';
  document.getElementById('imagePreviewArea').innerHTML = '';
  document.getElementById('imageInput').value = '';
}

async function analyzeImage() {
  if (!_selectedImageFile) return;
  const formData = new FormData();
  formData.append('file', _selectedImageFile);
  formData.append('knowledge_point', state.knowledgePoint || '');
  // Get current question text
  const lastQuestionEl = document.querySelector('.msg.system:last-child .bubble');
  const questionText = lastQuestionEl ? lastQuestionEl.textContent.replace(/💡.*$/, '').trim() : '';
  formData.append('question', questionText);

  appendSystemMessage('🖼️ 正在分析图片...');

  const btn = document.querySelector('#imagePreviewArea button:last-child');
  if (btn) { btn.disabled = true; btn.textContent = '分析中...'; }

  try {
    const resp = await fetch('/api/interrogation/analyze-image', {
      method: 'POST',
      body: formData,
    });
    const data = await resp.json();
    if (data.success && data.analysis) {
      // Show analysis result
      const chatArea = document.getElementById('chatArea');
      const div = document.createElement('div');
      div.className = 'msg system';
      div.innerHTML = `<div class="avatar">🤖</div><div class="bubble">
        <div style="font-size:13px;color:#667eea;margin-bottom:6px;">🔍 图片分析结果</div>
        <div style="font-size:13px;line-height:1.6;color:#555;">${escapeHtml(data.analysis)}</div>
      </div>`;
      chatArea.appendChild(div);
      chatArea.scrollTop = chatArea.scrollHeight;

      // Auto-fill as answer
      const input = document.getElementById('answerInput');
      input.value = data.analysis;
    } else {
      appendSystemMessage(`⚠️ 图片分析失败: ${data.detail || '未知错误'}`);
    }
  } catch (e) {
    appendSystemMessage(`⚠️ 图片分析网络错误: ${e.message}`);
  } finally {
    clearImage();
  }
}

// ==================== Init ====================
document.getElementById('userIdInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') loadKnowledgePoints();
});

// Auto-load if default user exists
</script>
