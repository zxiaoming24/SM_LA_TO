async function openCompetition(competitionId) {
  // 进行中的比赛重定向到全屏竞技场
  const checkResp = await fetch('/group/competition/detail/' + competitionId);
  const checkData = await checkResp.json();
  if (checkData.success && checkData.competition) {
    if (checkData.competition.status === 'running') {
      openCompetitionArena(competitionId);
      return;
    }
    if (checkData.competition.status === 'finished') {
      openCompetitionArena(competitionId);
      return;
    }
  }

  _currentGroupView = 'competition';
  const content = document.getElementById('groupContent');
  if (_rankPollTimers[competitionId]) clearInterval(_rankPollTimers[competitionId]);
  try {
    const resp = await fetch('/group/competition/detail/' + competitionId);
    const data = await resp.json();
    if (!data.success || !data.competition) { alert('比赛不存在'); return; }
    const comp = data.competition;
    const isOwner = comp.created_by === getUserId();
    const isRunning = comp.status === 'running';
    const isPending = comp.status === 'pending';

    // 题目渲染：待开始显示编辑按钮，进行中显示提交区
    let problemsHtml = '';
    (comp.problems || []).forEach(p => {
      const diffClass = p.difficulty === '简单' ? 'easy' : p.difficulty === '困难' ? 'hard' : 'medium';
      problemsHtml += `<div class="problem-card" id="prob_${p.id}">
        <div class="p-title">
          <span class="prob-title-display">${escapeHtml(p.title)}</span>
          <span class="p-diff ${diffClass}">${escapeHtml(p.difficulty)}</span>
          ${isOwner && isPending ? `
            <span style="float:right;font-size:12px;color:#888">${p.score}分</span>
          ` : ''}
        </div>
        <div class="p-desc prob-desc-display">${escapeHtml(p.description)}</div>
        ${!isOwner || !isPending ? `<div style="margin-top:8px;color:#888;font-size:12px">分值: ${p.score} 分</div>` : ''}
        ${isOwner && isPending ? `
          <div style="margin-top:10px;display:flex;gap:6px">
            <button onclick="editProblemInline(${comp.id},${p.id})" style="padding:4px 12px;background:#f0f9ff;color:#0ea5e9;border:1px solid #bae6fd;border-radius:6px;cursor:pointer;font-size:11px">✏️ 编辑</button>
            <button onclick="deleteProblem(${comp.id},${p.id})" style="padding:4px 12px;background:#fef2f2;color:#ef4444;border:1px solid #fecaca;border-radius:6px;cursor:pointer;font-size:11px">🗑️ 删除</button>
          </div>
        ` : ''}
        ${isRunning ? `
          <div style="margin-top:10px">
            <textarea id="answer_${p.id}" placeholder="输入你的答案/代码..." style="width:100%;padding:10px 14px;border:2px solid #e0e0e0;border-radius:10px;font-size:13px;font-family:monospace;min-height:80px;outline:none;resize:vertical"></textarea>
            <button onclick="submitAnswer(${comp.id},${p.id})" style="margin-top:6px;padding:8px 20px;background:#22c55e;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600">📤 提交</button>
          </div>
        ` : ''}
      </div>`;
    });

    // 排行区域
    const rankHtml = `<div class="leaderboard-container" id="leaderboard_${competitionId}">
      <div class="leaderboard-title"><span class="live-dot"></span> 实时排行 (每5秒更新)</div>
      <div style="text-align:center;color:#64748b;padding:20px">加载排行中...</div>
    </div>`;

    // 内联编辑：待开始且为创建者时，比赛信息直接可编辑
    function toLocalStr(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      return d.getFullYear() + '-' +
        String(d.getMonth()+1).padStart(2,'0') + '-' +
        String(d.getDate()).padStart(2,'0') + 'T' +
        String(d.getHours()).padStart(2,'0') + ':' +
        String(d.getMinutes()).padStart(2,'0');
    }
    const canEdit = isOwner && isPending;

    content.innerHTML = `
      <div style="margin-bottom:16px">
        <button onclick="openGroupDetail(${comp.group_id})" style="background:none;border:none;color:#667eea;cursor:pointer;font-size:13px">← 返回小组</button>
      </div>
      <div style="background:#fff;border-radius:12px;border:1px solid #e0e0e0;padding:20px;margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;align-items:start">
          <div style="flex:1">
            ${canEdit ? `
              <input id="inlineCompTitle" type="text" value="${escapeHtml(comp.title)}" style="width:100%;font-size:18px;font-weight:700;padding:8px 12px;border:2px solid #e0e0e0;border-radius:8px;outline:none;margin-bottom:6px">
              <textarea id="inlineCompDesc" style="width:100%;font-size:13px;color:#555;padding:8px 12px;border:2px solid #e0e0e0;border-radius:8px;outline:none;min-height:50px;resize:vertical;margin-bottom:6px">${escapeHtml(comp.description || '')}</textarea>
              <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
                <span style="font-size:12px;color:#888">状态: <span class="comp-status ${comp.status}">待开始</span></span>
                <input id="inlineCompStart" type="datetime-local" value="${toLocalStr(comp.start_at)}" style="padding:6px 10px;border:2px solid #e0e0e0;border-radius:6px;font-size:12px;outline:none">
                <span style="font-size:12px;color:#888">~</span>
                <input id="inlineCompEnd" type="datetime-local" value="${toLocalStr(comp.end_at)}" style="padding:6px 10px;border:2px solid #e0e0e0;border-radius:6px;font-size:12px;outline:none">
              </div>
            ` : `
              <div style="font-size:18px;font-weight:700">🏆 ${escapeHtml(comp.title)}</div>
              <div style="font-size:13px;color:#888;margin-top:4px">${escapeHtml(comp.description || '')}</div>
              <div style="font-size:12px;color:#888;margin-top:4px">
                状态: <span class="comp-status ${comp.status}">${isPending ? '待开始' : isRunning ? '🟢 进行中' : '已结束'}</span>
                ${comp.start_at ? ' · ' + formatLocalTime(comp.start_at) : ''}
                ${comp.end_at ? ' ~ ' + formatLocalTime(comp.end_at) : ''}
              </div>
            `}
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-left:12px">
            ${canEdit ? `<button onclick="doInlineUpdate(${comp.id})" style="padding:8px 20px;background:#22c55e;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600">💾 保存</button>` : ''}
            ${isOwner && isRunning ? `<button onclick="endCompetition(${comp.id})" style="padding:8px 20px;background:#ef4444;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600">⏹️ 结束比赛</button>` : ''}
          </div>
        </div>
        ${canEdit ? `
          <div style="margin-top:14px;padding-top:14px;border-top:1px dashed #e0e0e0;display:flex;gap:8px;flex-wrap:wrap">
            <button onclick="showGenerateProblemsForm(${comp.id})" style="padding:6px 14px;background:#6366f1;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600">🤖 AI 生成赛题</button>
            <button onclick="addProblemManually(${comp.id})" style="padding:6px 14px;background:#0ea5e9;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600">✏️ 手动添加题目</button>
          </div>
        ` : ''}
      </div>
      <div style="display:flex;gap:16px;flex-wrap:wrap">
        <div style="flex:1;min-width:350px">
          <div style="font-size:14px;font-weight:600;margin-bottom:10px">📝 题目 (${(comp.problems || []).length}道)</div>
          ${problemsHtml || '<div class="empty-state"><p>暂无题目</p></div>'}
        </div>
        <div style="flex:1;min-width:320px">
          ${(isRunning || comp.status === 'finished') ? rankHtml : '<div class="empty-state"><p>比赛开始后将显示排行榜</p></div>'}
        </div>
      </div>
    `;

    if (isRunning || comp.status === 'finished') {
      loadRanking(competitionId);
      if (isRunning) startRankPolling(competitionId);
    }
  } catch (e) {
    content.innerHTML = `<div class="empty-state"><p style="color:#e74c3c">${escapeHtml(e.message)}</p></div>`;
  }
}

async function startCompetition(competitionId) {
  try {
    const resp = await fetch('/group/competition/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ group_id: competitionId, user_id: getUserId() }),
    });
    const data = await resp.json();
    if (data.success) {
      alert('✅ 比赛已开始！');
      openCompetition(competitionId);
    } else {
      alert(data.error || '开始失败');
    }
  } catch(e) { alert('开始失败: ' + e.message); }
}

async function endCompetition(competitionId) {
  if (!confirm('确定结束比赛？')) return;
  try {
    const resp = await fetch('/group/competition/end', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ group_id: competitionId, user_id: getUserId() }),
    });
    const data = await resp.json();
    if (data.success) {
      alert('比赛已结束');
      if (_rankPollTimers[competitionId]) clearInterval(_rankPollTimers[competitionId]);
      openCompetition(competitionId);
    } else {
      alert(data.error || '结束失败');
    }
  } catch(e) { alert('结束失败: ' + e.message); }
}

async function deleteCompetitionFromCard(compId, groupId) {
  if (!confirm('确定删除这个比赛？不可恢复！')) return;
  try {
    const resp = await fetch('/group/competition/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ group_id: compId, user_id: getUserId() }),
    });
    const data = await resp.json();
    if (data.success) {
      openGroupDetail(groupId);
    } else {
      alert(data.error || '删除失败');
    }
  } catch(e) { alert('删除失败: ' + e.message); }
}

// ==================== 全屏比赛竞技场 ====================

let _arenaData = null;
let _arenaEditor = null;
let _arenaCurrentIdx = 0;
let _arenaProblemStatus = {};
let _arenaRankTimer = null;

async function openCompetitionArena(competitionId) {
  try {
    const resp = await fetch('/group/competition/detail/' + competitionId);
    const data = await resp.json();
    if (!data.success || !data.competition) { alert('比赛不存在'); return; }
    const comp = data.competition;
    _arenaData = comp;
    _arenaCurrentIdx = 0;

    // 构建覆盖层
    const overlay = document.createElement('div');
    overlay.id = 'arenaOverlay';
    overlay.style.cssText = 'position:fixed;inset:0;z-index:10000;background:#0f172a;display:flex;flex-direction:column;';
    overlay.innerHTML = `
      <!-- 顶栏 -->
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:#1e293b;border-bottom:1px solid #334155;flex-shrink:0">
        <div style="display:flex;align-items:center;gap:12px">
          <button onclick="closeCompetitionArena()" style="background:none;border:none;color:#94a3b8;cursor:pointer;font-size:14px">✕ 退出</button>
          <span style="color:#e2e8f0;font-weight:600">🏆 ${escapeHtml(comp.title)}</span>
        </div>
        <div style="display:flex;align-items:center;gap:16px">
          <span id="arenaTimer" style="color:#22c55e;font-size:14px;font-weight:600;font-family:monospace"></span>
          <span id="arenaSolvedCount" style="color:#94a3b8;font-size:13px">已通过: 0/0</span>
        </div>
      </div>
      <!-- 主体 -->
      <div style="display:flex;flex:1;overflow:hidden">
        <!-- 左侧: 题目导航 -->
        <div style="width:200px;background:#1e293b;border-right:1px solid #334155;overflow-y:auto;flex-shrink:0;padding:12px" id="arenaNav"></div>
        <!-- 中间: 题目 + 编辑器 -->
        <div style="flex:1;display:flex;flex-direction:column;overflow:hidden">
          <div id="arenaProblemArea" style="flex:1;overflow-y:auto;padding:20px"></div>
          <div style="border-top:1px solid #334155;background:#1e293b;padding:12px 20px;flex-shrink:0">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
              <select id="arenaLang" style="padding:6px 10px;border:1px solid #334155;border-radius:6px;background:#0f172a;color:#e2e8f0;font-size:13px;cursor:pointer">
                <option value="python">🐍 Python</option>
                <option value="cpp">⚡ C++</option>
                <option value="java">☕ Java</option>
                <option value="javascript">📜 JavaScript</option>
                <option value="c">🔧 C</option>
              </select>
              <div style="flex:1"></div>
              <button onclick="arenaPrevProblem()" style="padding:6px 16px;background:#334155;color:#e2e8f0;border:none;border-radius:6px;cursor:pointer;font-size:13px">◀ 上一题</button>
              <button onclick="arenaSubmit()" style="padding:6px 20px;background:#22c55e;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600">🚀 提交</button>
              <button onclick="arenaNextProblem()" style="padding:6px 16px;background:#334155;color:#e2e8f0;border:none;border-radius:6px;cursor:pointer;font-size:13px">下一题 ▶</button>
            </div>
            <textarea id="arenaCodeEditor" placeholder="# 在此编写代码..." style="width:100%;height:200px;background:#0f172a;color:#e2e8f0;border:1px solid #334155;border-radius:8px;padding:12px;font-family:monospace;font-size:13px;resize:none"></textarea>
          </div>
          <!-- 判分结果 -->
          <div id="arenaJudgeResult" style="display:none;padding:12px 20px;border-top:1px solid #334155;flex-shrink:0"></div>
        </div>
        <!-- 右侧: 排行 -->
        <div style="width:300px;background:#1e293b;border-left:1px solid #334155;overflow-y:auto;flex-shrink:0;padding:12px" id="arenaRanking"></div>
      </div>
    `;
    document.body.appendChild(overlay);

    // 初始化 CodeMirror
    _arenaEditor = CodeMirror.fromTextArea(document.getElementById('arenaCodeEditor'), {
      mode: 'python',
      theme: 'monokai',
      lineNumbers: true,
      styleActiveLine: true,
      autoCloseBrackets: true,
      lineWrapping: true,
      indentUnit: 4,
      tabSize: 4,
      extraKeys: {"Tab": "indentMore"},
    });
    _arenaEditor.setSize(null, 200);

    // 语言切换
    document.getElementById('arenaLang').onchange = function() {
      const modeMap = { python: 'python', cpp: 'text/x-c++src', java: 'text/x-java', javascript: 'javascript', c: 'text/x-csrc' };
      _arenaEditor.setOption('mode', modeMap[this.value] || 'python');
    };

    // 渲染左侧导航
    renderArenaNav();
    // 显示第一题
    arenaShowProblem(0);
    // 加载排行
    if (comp.status === 'running' || comp.status === 'finished') {
      arenaLoadRanking();
      if (comp.status === 'running') {
        _arenaRankTimer = setInterval(arenaLoadRanking, 5000);
        arenaStartTimer();
      }
    }
  } catch (e) { alert('加载失败: ' + e.message); }
}

function closeCompetitionArena() {
  if (_arenaRankTimer) clearInterval(_arenaRankTimer);
  _arenaRankTimer = null;
  const overlay = document.getElementById('arenaOverlay');
  if (overlay) overlay.remove();
  _arenaEditor = null;
  _arenaData = null;
}

function renderArenaNav() {
  const nav = document.getElementById('arenaNav');
  if (!nav || !_arenaData) return;
  const problems = _arenaData.problems || [];
  let html = '<div style="font-size:13px;font-weight:600;color:#94a3b8;margin-bottom:10px">📋 题目列表</div>';
  problems.forEach((p, idx) => {
    const status = _arenaProblemStatus[p.id];
    let icon = '○', color = '#64748b';
    if (status === 'accepted') { icon = '●'; color = '#22c55e'; }
    else if (status === 'wrong') { icon = '●'; color = '#ef4444'; }
    else if (status === 'partial') { icon = '●'; color = '#f59e0b'; }
    const isActive = idx === _arenaCurrentIdx;
    html += `<div onclick="arenaShowProblem(${idx})" style="padding:8px 12px;border-radius:8px;cursor:pointer;margin-bottom:4px;background:${isActive ? '#334155' : 'transparent'};border-left:3px solid ${isActive ? '#6366f1' : 'transparent'}">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="color:${color};font-size:16px">${icon}</span>
        <span style="color:#e2e8f0;font-size:13px">${escapeHtml(_getLetter(idx))}. ${escapeHtml(p.title)}</span>
      </div>
      ${status ? `<div style="font-size:11px;color:${color};margin-top:2px;margin-left:24px">${status === 'accepted' ? '✅ 已通过' : status === 'wrong' ? '❌ 未通过' : '⚠️ 部分通过'}</div>` : ''}
    </div>`;
  });
  // 底部排行缩略
  html += '<div style="margin-top:16px;padding-top:12px;border-top:1px solid #334155"><div style="font-size:12px;font-weight:600;color:#94a3b8;margin-bottom:8px">🏆 排行</div><div id="arenaMiniRank"></div></div>';
  nav.innerHTML = html;
}

function arenaShowProblem(idx) {
  if (!_arenaData) return;
  const problems = _arenaData.problems || [];
  if (idx < 0 || idx >= problems.length) return;
  _arenaCurrentIdx = idx;
  const p = problems[idx];
  const diffClass = p.difficulty === '简单' ? 'easy' : p.difficulty === '困难' ? 'hard' : 'medium';

  // 更新题目描述区
  const area = document.getElementById('arenaProblemArea');
  area.innerHTML = `
    <div style="background:#1e293b;border-radius:12px;padding:20px;border:1px solid #334155">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div style="font-size:18px;font-weight:700;color:#e2e8f0">${_getLetter(idx)}. ${escapeHtml(p.title)}</div>
        <span class="p-diff ${diffClass}" style="font-size:12px">${escapeHtml(p.difficulty)} · ${p.score}分</span>
      </div>
      <div style="font-size:14px;color:#cbd5e1;line-height:1.8;white-space:pre-wrap">${escapeHtml(p.description)}</div>
    </div>
  `;

  // 恢复编辑器内容
  const savedCode = localStorage.getItem('arena_code_' + _arenaData.id + '_' + p.id) || '';
  if (_arenaEditor) {
    _arenaEditor.setValue(savedCode);
    _arenaEditor.clearHistory();
  }

  // 更新导航高亮
  renderArenaNav();
  updateSolvedCount();
}

function arenaNextProblem() {
  const problems = _arenaData ? (_arenaData.problems || []) : [];
  if (_arenaCurrentIdx < problems.length - 1) arenaShowProblem(_arenaCurrentIdx + 1);
}

function arenaPrevProblem() {
  if (_arenaCurrentIdx > 0) arenaShowProblem(_arenaCurrentIdx - 1);
}

async function arenaSubmit() {
  if (!_arenaData) return;
  const problems = _arenaData.problems || [];
  const p = problems[_arenaCurrentIdx];
  if (!p || !_arenaEditor) return;
  const code = _arenaEditor.getValue().trim();
  if (!code) { alert('请先编写代码'); return; }

  // 保存代码到 localStorage
  localStorage.setItem('arena_code_' + _arenaData.id + '_' + p.id, code);

  const resultDiv = document.getElementById('arenaJudgeResult');
  resultDiv.style.display = 'block';
  resultDiv.innerHTML = '<div style="color:#94a3b8;font-size:13px">⏳ 评判中...</div>';

  try {
    const resp = await fetch('/group/competition/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ competition_id: _arenaData.id, problem_id: p.id, user_id: getUserId(), answer_text: code }),
    });
    const data = await resp.json();
    if (data.success) {
      const statusText = data.status === 'accepted' ? '✅ Accepted' : data.status === 'partial' ? '⚠️ Partial' : '❌ Wrong Answer';
      const passText = `通过: ${data.passed}/${data.total}`;
      _arenaProblemStatus[p.id] = data.status;
      resultDiv.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center">
        <div><span style="font-size:16px;font-weight:700;color:${data.status === 'accepted' ? '#22c55e' : data.status === 'partial' ? '#f59e0b' : '#ef4444'}">${statusText}</span>
        <span style="color:#94a3b8;font-size:13px;margin-left:12px">得分: ${data.score} · ${passText}</span></div>
        <button onclick="document.getElementById('arenaJudgeResult').style.display='none'" style="background:none;border:none;color:#94a3b8;cursor:pointer;font-size:12px">关闭</button>
      </div>`;
      renderArenaNav();
      updateSolvedCount();
      arenaLoadRanking();
    } else {
      resultDiv.innerHTML = `<div style="color:#ef4444;font-size:13px">${escapeHtml(data.error || '提交失败')}</div>`;
    }
  } catch(e) {
    resultDiv.innerHTML = `<div style="color:#ef4444;font-size:13px">提交失败: ${escapeHtml(e.message)}</div>`;
  }
}

function updateSolvedCount() {
  const solved = Object.values(_arenaProblemStatus).filter(s => s === 'accepted').length;
  const total = (_arenaData && _arenaData.problems) ? _arenaData.problems.length : 0;
  const el = document.getElementById('arenaSolvedCount');
  if (el) el.textContent = `已通过: ${solved}/${total}`;
}

function arenaStartTimer() {
  if (!_arenaData || !_arenaData.end_at) return;
  const endTime = new Date(_arenaData.end_at).getTime();
  const timer = setInterval(() => {
    const now = Date.now();
    const diff = Math.max(0, endTime - now);
    const el = document.getElementById('arenaTimer');
    if (!el) { clearInterval(timer); return; }
    if (diff <= 0) {
      el.textContent = '⏱ 已结束';
      el.style.color = '#ef4444';
      clearInterval(timer);
    } else {
      const h = Math.floor(diff / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      el.textContent = `⏱ ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }
  }, 1000);
}

async function arenaLoadRanking() {
  const container = document.getElementById('arenaRanking');
  if (!container || !_arenaData) return;
  try {
    const resp = await fetch('/group/competition/ranking/' + _arenaData.id);
    const data = await resp.json();
    if (!data.success || !data.ranking) return;
    const ranking = data.ranking;
    const problems = _arenaData.problems || [];

    let html = '<div style="font-size:14px;font-weight:700;color:#e2e8f0;margin-bottom:12px">🏆 实时排行</div>';
    if (ranking.length === 0) {
      html += '<div style="color:#64748b;font-size:13px;text-align:center;padding:20px">暂无提交</div>';
    } else {
      // 表头
      html += '<table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr>';
      html += '<th style="color:#94a3b8;padding:4px;text-align:center">#</th>';
      html += '<th style="color:#94a3b8;padding:4px;text-align:left">选手</th>';
      html += '<th style="color:#94a3b8;padding:4px;text-align:center">得分</th>';
      problems.forEach((p, i) => {
        html += `<th style="color:#94a3b8;padding:2px;text-align:center;font-size:11px" title="${escapeHtml(p.title)}">${_getLetter(i)}</th>`;
      });
      html += '</tr></thead><tbody>';

      ranking.forEach((r, ri) => {
        const medal = r.rank === 1 ? '🥇' : r.rank === 2 ? '🥈' : r.rank === 3 ? '🥉' : '';
        html += `<tr style="border-bottom:1px solid #1e293b">`;
        html += `<td style="color:#e2e8f0;padding:4px;text-align:center">${medal || r.rank}</td>`;
        html += `<td style="color:#e2e8f0;padding:4px;text-align:left;font-size:12px">${escapeHtml(r.user_id)}</td>`;
        html += `<td style="color:#22c55e;padding:4px;text-align:center;font-weight:700">${r.total_score}</td>`;
        (r.problem_list || []).forEach(pr => {
          let color = '#334155', text = '-';
          if (pr.status === 'accepted' && pr.score >= 80) { color = '#22c55e'; text = '✓'; }
          else if (pr.status === 'partial' || (pr.status === 'accepted' && pr.score < 80)) { color = '#f59e0b'; text = '~'; }
          else if (pr.status === 'wrong') { color = '#ef4444'; text = '✗'; }
          const timeStr = pr.time_cost ? formatTime(pr.time_cost) : '';
          html += `<td style="color:${color};padding:2px;text-align:center;font-size:12px;font-weight:600" title="${pr.score}分 ${timeStr}">${text}</td>`;
        });
        // 补全未作答的题目列
        for (let i = (r.problem_list || []).length; i < problems.length; i++) {
          html += `<td style="color:#334155;padding:2px;text-align:center;font-size:12px">-</td>`;
        }
        html += '</tr>';
      });
      html += '</tbody></table>';

      // 图例
      html += '<div style="margin-top:10px;display:flex;gap:12px;font-size:11px;color:#64748b;flex-wrap:wrap">';
      html += '<span><span style="color:#22c55e">✓</span> 通过</span>';
      html += '<span><span style="color:#f59e0b">~</span> 部分</span>';
      html += '<span><span style="color:#ef4444">✗</span> 错误</span>';
      html += '<span style="color:#334155">-</span> 未作答</span>';
      html += '</div>';
    }
    container.innerHTML = html;

    // 也更新左侧迷你排行
    const miniRank = document.getElementById('arenaMiniRank');
    if (miniRank && ranking.length > 0) {
      let mhtml = '';
      ranking.slice(0, 5).forEach(r => {
        const medal = r.rank === 1 ? '🥇' : r.rank === 2 ? '🥈' : r.rank === 3 ? '🥉' : `${r.rank}.`;
        mhtml += `<div style="display:flex;justify-content:space-between;font-size:12px;color:#cbd5e1;padding:3px 0">
          <span>${medal} ${escapeHtml(r.user_id)}</span>
          <span style="color:#22c55e">${r.total_score}分</span>
        </div>`;
      });
      miniRank.innerHTML = mhtml;
    }
  } catch(e) {}
}

function _getLetter(i) {
  return String.fromCharCode(65 + i);
}

function showGenerateProblemsForm(compId) {
  const overlay = document.createElement('div');

  overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };
  overlay.innerHTML = `
    <div style="background:#fff;border-radius:16px;padding:28px;max-width:450px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,0.15)">

      <div style="margin-bottom:14px">
        <label style="font-size:13px;font-weight:600;color:#333">比赛主题（用于生成赛题）</label>
        <textarea id="aiTopicInput" placeholder="输入主题，例如：动态规划、字符串处理..." style="width:100%;padding:10px 14px;border:2px solid #e0e0e0;border-radius:10px;font-size:14px;margin-top:4px;outline:none;min-height:60px"></textarea>
      </div>
      <div style="margin-bottom:14px">
        <label style="font-size:13px;font-weight:600;color:#333">题目数量</label>

      </div>

async function doGenerateProblems(compId) {
  const topic = document.getElementById('aiTopicInput')?.value.trim() || '编程算法';
  const count = parseInt(document.getElementById('aiCountInput')?.value || '3');
  // 按钮加载状态
  const btn = document.querySelector('[onclick*="doGenerateProblems"]');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner-sm"></span> 生成中...'; }
  try {
    const resp = await fetch('/group/competition/generate-problems', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ competition_id: compId, user_id: getUserId(), input_text: topic, problem_count: count }),
    });
    const data = await resp.json();
    if (data.success) {
      alert(`✅ 已生成 ${data.count} 道赛题`);
      document.querySelectorAll('[style]').forEach(el => { if (el.style.zIndex === '2000') el.remove(); });
      openCompetition(compId);
    } else {
      alert(data.error || '生成失败');
      if (btn) { btn.disabled = false; btn.innerHTML = '🚀 生成'; }
    }
  } catch(e) { 
    alert('生成失败: ' + e.message); 
    if (btn) { btn.disabled = false; btn.innerHTML = '🚀 生成'; }
  }
}

function editProblemInline(compId, probId) {
  const card = document.getElementById('prob_' + probId);
  if (!card) return;
  const titleEl = card.querySelector('.prob-title-display');
  const descEl = card.querySelector('.prob-desc-display');
  if (!titleEl || !descEl) return;
  const oldTitle = titleEl.textContent;
  const oldDesc = descEl.textContent;
  const oldDiff = card.querySelector('.p-diff')?.textContent || '中等';
  titleEl.innerHTML = `<input id="edit_title_${probId}" type="text" value="${escapeHtml(oldTitle)}" style="width:80%;padding:6px 10px;border:2px solid #0ea5e9;border-radius:6px;font-size:13px;outline:none">`;
  descEl.innerHTML = `<textarea id="edit_desc_${probId}" style="width:100%;padding:6px 10px;border:2px solid #0ea5e9;border-radius:6px;font-size:13px;outline:none;min-height:60px">${escapeHtml(oldDesc)}</textarea>`;
  const actionsDiv = card.querySelector('div:last-child');
  if (actionsDiv) {
    actionsDiv.innerHTML = `
      <button onclick="saveProblemEdit(${compId},${probId})" style="padding:4px 12px;background:#22c55e;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:11px">💾 保存</button>
      <button onclick="openCompetition(${compId})" style="padding:4px 12px;background:#f3f4f6;color:#666;border:1px solid #ddd;border-radius:6px;cursor:pointer;font-size:11px">取消</button>
    `;
  }
}

async function saveProblemEdit(compId, probId) {
  const newTitle = document.getElementById('edit_title_' + probId)?.value.trim();
  const newDesc = document.getElementById('edit_desc_' + probId)?.value.trim();
  if (!newTitle || !newDesc) { alert('标题和描述不能为空'); return; }
  try {
    // 重新获取当前比赛的所有题目，编辑后整体保存
    const detailResp = await fetch('/group/competition/detail/' + compId);
    const detailData = await detailResp.json();
    if (!detailData.success) { alert('获取赛题失败'); return; }
    const problems = (detailData.competition.problems || []).map(p => {
      if (p.id === probId) {
        return { title: newTitle, description: newDesc, difficulty: p.difficulty, score: p.score };
      }
      return { title: p.title, description: p.description, difficulty: p.difficulty, score: p.score };
    });
    const resp = await fetch('/group/competition/save-problems', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ competition_id: compId, user_id: getUserId(), problems }),
    });
    const data = await resp.json();
    if (data.success) {
      openCompetition(compId);
    } else {
      alert(data.error || '保存失败');
    }
  } catch(e) { alert('保存失败: ' + e.message); }
}

async function deleteProblem(compId, probId) {
  if (!confirm('确定删除这道题？')) return;
  try {
    const detailResp = await fetch('/group/competition/detail/' + compId);
    const detailData = await detailResp.json();
    if (!detailData.success) { alert('获取赛题失败'); return; }
    const problems = (detailData.competition.problems || [])
      .filter(p => p.id !== probId)
      .map(p => ({ title: p.title, description: p.description, difficulty: p.difficulty, score: p.score }));
    const resp = await fetch('/group/competition/save-problems', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ competition_id: compId, user_id: getUserId(), problems }),
    });
    const data = await resp.json();
    if (data.success) {
      openCompetition(compId);
    } else {
      alert(data.error || '删除失败');
    }
  } catch(e) { alert('删除失败: ' + e.message); }
}

async function doAddProblem(compId) {
  const title = document.getElementById('manualTitle')?.value.trim();
  const desc = document.getElementById('manualDesc')?.value.trim();
  if (!title || !desc) { alert('题目名称和描述不能为空'); return; }
  const difficulty = document.getElementById('manualDiff')?.value || '中等';
  const score = parseInt(document.getElementById('manualScore')?.value || '100');
  const btn = document.querySelector('[onclick*="doAddProblem"]');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner-sm"></span> 添加中...'; }
  try {
    // 追加模式：只发送新题目，replace=false
    const problems = [{ title, description: desc, difficulty, score }];
    const resp = await fetch('/group/competition/save-problems', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ competition_id: compId, user_id: getUserId(), problems, replace: false }),
    });
    const data = await resp.json();
    if (data.success) {
      alert('✅ 已添加');
      document.querySelectorAll('[style]').forEach(el => { if (el.style.zIndex === '2000') el.remove(); });
      openCompetition(compId);
    } else {
      alert(data.error || '添加失败');
      if (btn) { btn.disabled = false; btn.innerHTML = '✅ 添加'; }
    }
  } catch(e) { 
    alert('添加失败: ' + e.message); 
    if (btn) { btn.disabled = false; btn.innerHTML = '✅ 添加'; }
  }
}

async function submitAnswer(competitionId, problemId) {
  const textarea = document.getElementById('answer_' + problemId);
  if (!textarea || !textarea.value.trim()) { alert('请输入答案'); return; }
  const answer = textarea.value.trim();
  const btn = textarea.nextElementSibling;
  if (btn) btn.disabled = true;
  try {
    const resp = await fetch('/group/competition/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ competition_id: competitionId, problem_id: problemId, user_id: getUserId(), answer_text: answer }),
    });
    const data = await resp.json();
    if (data.success) {
      const statusText = data.status === 'accepted' ? '✅ 完全通过' : data.status === 'partial' ? '⚠️ 部分通过' : '❌ 未通过';
      alert(`提交成功！\n得分: ${data.score}/${data.total * 20}\n状态: ${statusText}\n通过: ${data.passed}/${data.total}`);
      loadRanking(competitionId);
    } else {
      alert(data.error || '提交失败');
    }
  } catch(e) { alert('提交失败: ' + e.message); }
  if (btn) btn.disabled = false;
}

// ==================== 实时排行 ====================

let _lastRanking = {};
let _previousRankingData = {};

async function loadRanking(competitionId) {
  try {
    const resp = await fetch('/group/competition/ranking/' + competitionId);
    const data = await resp.json();
    if (!data.success || !data.ranking) return;
    const ranking = data.ranking;
    renderLeaderboard(competitionId, ranking);
  } catch(e) {}
}

function startRankPolling(competitionId) {
  if (_rankPollTimers[competitionId]) clearInterval(_rankPollTimers[competitionId]);
  _rankPollTimers[competitionId] = setInterval(() => loadRanking(competitionId), 5000);
}

function renderLeaderboard(competitionId, ranking) {
  const container = document.getElementById('leaderboard_' + competitionId);
  if (!container) return;

  // 保存当前排名用于动画检测
  const prevRanks = {};
  if (_previousRankingData[competitionId]) {
    _previousRankingData[competitionId].forEach(r => {
      prevRanks[r.user_id] = r.rank;
    });
  }
  _previousRankingData[competitionId] = ranking;

  if (ranking.length === 0) {
    container.innerHTML = `<div class="leaderboard-title"><span class="live-dot"></span> 实时排行 (每5秒更新)</div>
      <div style="text-align:center;color:#64748b;padding:30px">暂无提交记录</div>`;
    return;
  }

  let rows = '<table class="lb-table"><thead><tr><th>#</th><th>选手</th><th>得分</th><th>罚时</th><th>通过</th><th>题目详情</th></tr></thead><tbody>';
  ranking.forEach((r, idx) => {
    const rankClass = r.rank <= 3 ? 'lb-rank-' + r.rank : '';
    let animClass = '';
    if (prevRanks[r.user_id] !== undefined) {
      if (r.rank < prevRanks[r.user_id]) animClass = 'rank-up';
      else if (r.rank > prevRanks[r.user_id]) animClass = 'rank-down';
    }
    const medal = r.rank === 1 ? '🥇' : r.rank === 2 ? '🥈' : r.rank === 3 ? '🥉' : '';

    // 题目详情列
    let probHtml = '';
    (r.problem_list || []).forEach(p => {
      let cls = 'lb-problem-empty';
      let txt = '-';
      if (p.status === 'accepted' && p.score >= 80) { cls = 'lb-problem-ac'; txt = '✓'; }
      else if (p.status === 'partial' || (p.status === 'accepted' && p.score < 80)) { cls = 'lb-problem-partial'; txt = '~'; }
      else if (p.status === 'wrong') { cls = 'lb-problem-wa'; txt = '✗'; }
      probHtml += `<span class="${cls}" title="${escapeHtml(p.letter || '')} ${p.score}分">${escapeHtml(p.letter || '')}${txt}</span> `;
    });

    rows += `<tr class="lb-row ${animClass}">
      <td class="${rankClass}">${medal || r.rank}</td>
      <td style="text-align:left;padding-left:10px">${escapeHtml(r.user_id)}</td>
      <td class="lb-score">${r.total_score}</td>
      <td class="lb-penalty">${formatTime(r.total_penalty)}</td>
      <td>${r.solved}</td>
      <td style="font-size:13px">${probHtml}</td>
    </tr>`;
  });
  rows += '</tbody></table>';

  container.innerHTML = `<div class="leaderboard-title"><span class="live-dot"></span> 实时排行 (每5秒更新)</div>${rows}`;
}

function formatTime(seconds) {
  if (!seconds || seconds <= 0) return '0s';
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  if (m > 0) return m + 'm' + s + 's';
  return s + 's';
}

function formatLocalTime(isoStr) {
  if (!isoStr) return '';
  try {
    return new Date(isoStr).toLocaleTimeString('zh-CN', { hour:'2-digit', minute:'2-digit', hour12: false });
  } catch(e) { return (isoStr || '').slice(11,16); }
}
