}

let _phaseIndexForAccept = -1;

function showPhaseCompleteModal(notif) {
  _phaseIndexForAccept = notif.phase_index;
  const assessment = notif.assessment || {};
  const summary = assessment.phase_summary || {};
  const readiness = assessment.readiness || {};
  const kpAnalysis = assessment.knowledge_point_analysis || [];
  const weakPoints = assessment.weak_points || [];
  const adjustments = assessment.adjustments || {};

  // ★★★ 判空检查：确保弹窗元素存在 ★★★
  const bodyEl = document.getElementById('phaseCompleteBody');
  const acceptBtn = document.getElementById('phaseAcceptBtn');
  const modal = document.getElementById('phaseCompleteModal');
  if (!bodyEl || !modal) {
    console.error('[评估弹窗] phaseCompleteBody 或 phaseCompleteModal 不存在');
    return;
  }

  let kpHtml = '';
  if (kpAnalysis.length) {
    kpHtml = '<div style="margin-top:12px"><div style="font-weight:600;margin-bottom:6px">📊 知识点掌握</div>';
    kpAnalysis.forEach(kp => {
      const color = kp.score >= 80 ? '#27ae60' : kp.score >= 60 ? '#f39c12' : '#e74c3c';
      kpHtml += `<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px"><span>${escapeHtml(kp.name)}</span><span style="color:${color};font-weight:600">${kp.score}分 · ${kp.mastery || ''}</span></div>`;
    });
    kpHtml += '</div>';
  }

  let weakHtml = '';
  if (weakPoints.length) {
    weakHtml = '<div style="margin-top:12px"><div style="font-weight:600;color:#e74c3c;margin-bottom:6px">⚠️ 薄弱点</div>';
    weakPoints.forEach(w => { weakHtml += `<div style="padding:4px 0;font-size:13px">• ${escapeHtml(w.point)}</div>`; });
    weakHtml += '</div>';
  }

  let readyHtml = '';
  if (readiness.score !== undefined) {
    readyHtml = `<div style="margin-top:12px;padding:10px;background:${readiness.ready ? '#e8f5e9' : '#fff3e0'};border-radius:8px"><div style="font-weight:600">${readiness.ready ? '✅ 可以进入下一阶段' : '⚠️ 建议巩固后再进入下一阶段'}</div><div style="font-size:13px;margin-top:4px">准备度评分: ${readiness.score}/100</div>${readiness.suggestions?.length ? '<div style="font-size:12px;color:#666;margin-top:4px">💡 ' + escapeHtml(readiness.suggestions[0]) + '</div>' : ''}</div>`;
  }

  bodyEl.innerHTML = `
    <div style="text-align:center;margin-bottom:16px">
      <div style="font-size:28px;font-weight:700;color:#e74c3c">${summary.score || '?'}分</div>
      <div style="font-size:14px;color:#888">${summary.status || ''}</div>
      <div style="font-size:13px;color:#666;margin-top:4px">${escapeHtml(notif.phase_name)}</div>
    </div>
    ${summary.summary ? `<div style="background:#f8f9fa;padding:12px;border-radius:8px;font-size:13px;line-height:1.6">${escapeHtml(summary.summary)}</div>` : ''}
    ${kpHtml}${weakHtml}${readyHtml}
    ${adjustments.remedy_suggestions?.length ? `<div style="margin-top:12px"><div style="font-weight:600;color:#8e44ad;margin-bottom:6px">📖 补救建议</div>${adjustments.remedy_suggestions.map(s => `<div style="padding:3px 0;font-size:13px">• ${escapeHtml(s)}</div>`).join('')}</div>` : ''}
  `;
  
  // ★★★ 判空检查：接受按钮可能不存在 ★★★
  if (acceptBtn) {
    acceptBtn.style.display = assessment?.phase_summary ? 'inline-block' : 'none';
  }
  
  // ★★★ 重置底部按钮：确保不残留考试结果弹窗的按钮 ★★★
  const modalActions = document.querySelector('.modal-actions');
  if (modalActions) {
    modalActions.innerHTML = `
      <button class="btn-cancel" onclick="dismissPhaseNotification()">稍后再说</button>
      <button class="btn-submit" id="phaseAcceptBtn" onclick="acceptPhaseAssessment()" style="display:${assessment?.phase_summary ? 'inline-block' : 'none'}">✅ 进入下一阶段</button>
    `;

}

async function acceptPhaseAssessment() {
  const btn = document.getElementById('phaseAcceptBtn');
  if (!btn) {
    console.error('[接受评估] phaseAcceptBtn 不存在');
    return;
  }
  
  // ★★★ 立即显示等待状态，跳过"应用中..." ★★★
  // 同时暂停通知轮询，防止 checkPhaseNotification 重新弹出评估窗
  if (window._notifPollTimer) {
    clearInterval(window._notifPollTimer);
    window._notifPollTimer = null;
  }
  const bodyEl = document.getElementById('phaseCompleteBody');
  const modalActions = document.querySelector('.modal-actions');
  if (bodyEl) {
    bodyEl.innerHTML = '<div style="text-align:center;padding:40px"><span class="spinner-sm"></span><div style="margin-top:16px;color:#888">正在为你规划下一阶段学习内容...</div></div>';
  }
  if (modalActions) {
    modalActions.innerHTML = '';
  }
  
  try {
    const userId = document.getElementById('userId')?.value || localStorage.getItem('study_plan_user_id') || 'user_001';
    const paResp = await fetch(`/assessment/phase-apply/${userId}/${_phaseIndexForAccept}`, { method: 'POST' });
    const paData = await paResp.json();
    await fetch(`/study_plan/${userId}/notification/ack`, { method: 'POST' });

    // ★★★ 所有阶段已完成 → 显示续期流程 ★★★
    if (paData.all_phases_completed) {
      const bodyEl = document.getElementById('phaseCompleteBody');
      const modalActions = document.querySelector('.modal-actions');
      if (bodyEl) {
        bodyEl.innerHTML = `
          <div style="text-align:center;padding:30px">
            <div style="font-size:48px;margin-bottom:16px">🎉</div>
            <div style="font-size:20px;font-weight:700;color:#2d3436">所有阶段已完成！</div>
            <div style="font-size:14px;color:#888;margin-top:8px">你可以接收续期学习计划，继续进阶学习</div>
          </div>
        `;
      }
      if (modalActions) {
        modalActions.innerHTML = `
          <button class="btn-cancel" onclick="document.getElementById('phaseCompleteModal').classList.remove('active')">稍后再说</button>
          <button class="btn-submit" onclick="triggerContinuationAfterAssessment()">📋 接收续期计划</button>
        `;
      }
      return;
    }

    const currentPlanId = _currentPlanId;
    console.log('[评估] 开始等待新版本, 当前planId:', currentPlanId);
    for (let i = 0; i < 30; i++) {
      await new Promise(r => setTimeout(r, 1000));
      if (i % 5 === 0) console.log('[评估] 等待新版本中... 第' + (i+1) + '秒');
      try {
        const vtResp = await fetch(`/study_plan/${userId}/version-tree?plan_id=${encodeURIComponent(currentPlanId)}`);
        const vtData = await vtResp.json();
        if (vtData.status === 'success' && vtData.has_tree && vtData.versions) {
          _cachedVersionTree = vtData;
          const activeId = vtData.active_version_plan_id;
          if (activeId && activeId !== currentPlanId) {
            console.log('[评估] 检测到新版本:', activeId, '，正在跳转...');
            // ★★★ 先对新版本也执行 ack，防止恢复轮询后再次弹出评估 ★★★
            try {
              await fetch(`/study_plan/${userId}/notification/ack?phase_index=${_phaseIndexForAccept}`, { method: 'POST' });
            } catch (e) {}
            // 恢复通知轮询
            if (!window._notifPollTimer) window._notifPollTimer = setInterval(checkPhaseNotification, 10000);
            // 新版本出现，关闭弹窗并跳转
            const modal = document.getElementById('phaseCompleteModal');
            if (modal) modal.classList.remove('active');
            viewPlan(activeId);
            return;
          }
        }
      } catch (e) {
        console.warn('[评估] 版本树查询失败:', e);
      }
    }
    // 超时，关弹窗刷新
    console.log('[评估] 等待超时，刷新当前计划');
    if (!window._notifPollTimer) window._notifPollTimer = setInterval(checkPhaseNotification, 10000);
    const modal = document.getElementById('phaseCompleteModal');
    if (modal) modal.classList.remove('active');
    viewPlan(currentPlanId);
  } catch (e) {
    console.error('[评估] 失败:', e);
    if (!window._notifPollTimer) window._notifPollTimer = setInterval(checkPhaseNotification, 10000);
    alert('保存评估报告失败，请重试');
    btn.disabled = false; btn.textContent = '✅ 进入下一阶段';
  }
}

// ==================== 逐题考试模式 ====================
let _examCurrentIdx = 0;
let _examTotalQuestions = 0;
let _examQuestions = [];
let _examPhaseIndex = -1;

// 显示考试答题界面 — 逐题模式
function showExamModal(examData, phaseIndex) {
  _examActive = true;  // ★ 开始答题，防止轮询覆盖
  _examAnswers = {};
  _examCurrentIdx = 0;
  _examPhaseIndex = phaseIndex;
  
  // 构建扁平题目列表
  _examQuestions = [];
  const progQ = examData.programming_questions || [];
  const theoryQ = examData.theory_questions || [];
  
  progQ.forEach((q, idx) => {
    _examQuestions.push({
      key: `programming_${idx}`,
      type: 'programming',
      index: idx,
      score: 30,
      data: q,
    });
  });
  theoryQ.forEach((q, idx) => {
    const typeLabel = { single_choice: '单选题', multiple_choice: '多选题', judge: '判断题' }[q.type] || '其他';
    _examQuestions.push({
      key: `theory_${idx}`,
      type: q.type || 'single_choice',
      index: idx,
      score: 10,
      data: q,
      typeLabel,
    });
  });
  
  _examTotalQuestions = _examQuestions.length;
  if (_examTotalQuestions === 0) {
    document.getElementById('phaseCompleteBody').innerHTML = '<div style="padding:20px;text-align:center;color:#888">暂无题目</div>';
    return;
  }
  
  // 构建进度条区域
  renderExamQuestion();
}

function renderExamQuestion() {
  const body = document.getElementById('phaseCompleteBody');
  const q = _examQuestions[_examCurrentIdx];
  const progress = `${_examCurrentIdx + 1}/${_examTotalQuestions}`;
  const pct = ((_examCurrentIdx + 1) / _examTotalQuestions * 100).toFixed(0);
  
  let questionHtml = '';
  const answer = _examAnswers[q.key] || '';
  
  if (q.type === 'programming') {
    const pd = q.data;
    questionHtml = `
      <div class="exam-question">
        <div class="eq-header">
          <span class="eq-type">编程题 ${q.index + 1}</span>
          <span class="eq-score">${q.score}分</span>
        </div>
        <div class="eq-text">${escapeHtml(pd.description || pd.title || '')}</div>
        <div style="margin:8px 0;font-size:12px;color:#666">输入格式：${escapeHtml(pd.input_format || '')}</div>
        <div style="margin:8px 0;font-size:12px;color:#666">输出格式：${escapeHtml(pd.output_format || '')}</div>
        ${(pd.examples || []).map((ex, ei) => `
          <div style="background:#f6f8fa;padding:8px;border-radius:6px;margin:6px 0;font-size:12px">
            <div><b>示例${ei+1}:</b></div>
            <div>输入: ${escapeHtml(ex.input || '')}</div>
            <div>输出: ${escapeHtml(ex.output || '')}</div>
            ${ex.explanation ? `<div>说明: ${escapeHtml(ex.explanation)}</div>` : ''}
          </div>
        `).join('')}
        <textarea class="exam-code-area" id="prog_input" placeholder="请输入你的代码..." style="margin-top:12px">${answer}</textarea>
      </div>`;
  } else if (q.type === 'judge') {
    questionHtml = `
      <div class="exam-question">
        <div class="eq-header">
          <span class="eq-type">判断题 ${q.index + 1}</span>
          <span class="eq-score">${q.score}分</span>
        </div>
        <div class="eq-text">${escapeHtml(q.data.question || '')}</div>
        <div class="eq-options" style="margin-top:12px">
          <label class="exam-option ${answer === '正确' ? 'selected' : ''}" onclick="selectTheoryOption('${q.key}', '正确', this)">
            <input type="radio" name="current_q" value="正确" ${answer === '正确' ? 'checked' : ''}>
            <span>✓ 正确</span>
          </label>
          <label class="exam-option ${answer === '错误' ? 'selected' : ''}" onclick="selectTheoryOption('${q.key}', '错误', this)">
            <input type="radio" name="current_q" value="错误" ${answer === '错误' ? 'checked' : ''}>
            <span>✗ 错误</span>
          </label>
        </div>
      </div>`;
  } else {
    const options = q.data.options || [];
    const isMultiple = q.type === 'multiple_choice';
    questionHtml = `
      <div class="exam-question">
        <div class="eq-header">
          <span class="eq-type">${q.typeLabel} ${q.index + 1}</span>
          <span class="eq-score">${q.score}分</span>
        </div>
        <div class="eq-text">${escapeHtml(q.data.question || '')}</div>
        <div class="eq-options" style="margin-top:12px">
          ${options.map((opt, oi) => {
            const optLabel = String.fromCharCode(65 + oi);
            const checked = answer.includes(optLabel);
            return `
              <label class="exam-option ${checked ? 'selected' : ''}" 
                     onclick="${isMultiple ? 'toggleMultiOption' : 'selectTheoryOption'}('${q.key}', '${optLabel}', this${isMultiple ? ', true' : ''})">
                <input type="${isMultiple ? 'checkbox' : 'radio'}" name="current_q" value="${optLabel}" ${checked ? 'checked' : ''}>
                <span>${optLabel}. ${escapeHtml(opt || '')}</span>
              </label>`;
          }).join('')}
        </div>
      </div>`;
  }
  
  body.innerHTML = `
    <div style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;font-size:12px;color:#888;margin-bottom:4px">
        <span>📝 考试答题</span>
        <span>${progress}</span>
      </div>
      <div style="height:4px;background:#e8e8e8;border-radius:2px">
        <div style="height:4px;background:#6c5ce7;border-radius:2px;width:${pct}%;transition:width 0.3s"></div>
      </div>
    </div>
    ${questionHtml}
  `;
  
  // 绑定编程题输入
  if (q.type === 'programming') {
    const ta = document.getElementById('prog_input');
    if (ta) ta.oninput = () => { _examAnswers[q.key] = ta.value; };
  }
  
  // 构建按钮
  const modalActions = document.querySelector('.modal-actions');
  const isFirst = _examCurrentIdx <= 0;
  const isLast = _examCurrentIdx >= _examTotalQuestions - 1;
  modalActions.innerHTML = `
    <button class="btn-cancel" onclick="cancelExam()">取消考试</button>
    <div style="flex:1"></div>
    ${!isFirst ? `<button class="btn-cancel" onclick="prevExamQuestion()" style="margin-right:8px">← 上一题</button>` : ''}
    ${isLast
      ? `<button class="btn-submit" onclick="confirmSubmitExam(${_examPhaseIndex})">📤 提交答卷</button>`
      : `<button class="btn-submit" onclick="nextExamQuestion()">下一题 →</button>`
    }
  `;
}

function prevExamQuestion() {
  saveCurrentAnswerFromDOM();
  if (_examCurrentIdx > 0) {
    _examCurrentIdx--;
    renderExamQuestion();
  }
}

function confirmSubmitExam(phaseIndex) {
  // 统计未答题目
  const total = _examTotalQuestions;
  const answered = Object.keys(_examAnswers).length;
  const unanswered = total - answered;
  if (unanswered > 0 && !confirm(`还有 ${unanswered} 道题未作答，确定要提交吗？`)) {
    return;
  }
  submitExamAnswers(phaseIndex);
}

function nextExamQuestion() {
  // ★★★ 从 DOM 读取当前题目的答案再切换 ★★★
  saveCurrentAnswerFromDOM();
  
  _examCurrentIdx++;
  renderExamQuestion();
}

// 从 DOM 读取当前题目的答案（统一方法）
function saveCurrentAnswerFromDOM() {
  const q = _examQuestions[_examCurrentIdx];
  if (!q) return;
  
  if (q.type === 'programming') {
    const ta = document.getElementById('prog_input');
    if (ta) _examAnswers[q.key] = ta.value;
    return;
  }
  
  // 理论题：从已选中的 input 读取
  if (q.type === 'multiple_choice') {
    const checked = document.querySelectorAll(`input[name="current_q"]:checked`);
    const values = Array.from(checked).map(inp => inp.value);
    _examAnswers[q.key] = values.join(',');
  } else {
    const checked = document.querySelector(`input[name="current_q"]:checked`);
    if (checked) _examAnswers[q.key] = checked.value;
  }
}

function selectTheoryOption(key, value, el) {
  _examAnswers[key] = value;
  // 清除同级其他选项的选中样式
  const parent = el.closest('.eq-options');
  if (parent) {
    parent.querySelectorAll('.exam-option').forEach(opt => opt.classList.remove('selected'));
  }
  el.classList.add('selected');
}

function toggleMultiOption(key, value, el) {
  const current = _examAnswers[key] || '';
  const parts = current ? current.split(',') : [];
  const idx = parts.indexOf(value);
  if (idx >= 0) {
    parts.splice(idx, 1);
    el.classList.remove('selected');
  } else {
    parts.push(value);
    el.classList.add('selected');
  }
  _examAnswers[key] = parts.join(',');
}

// 提交考试答案
async function submitExamAnswers(phaseIndex) {
  const userId = document.getElementById('userId')?.value || localStorage.getItem('study_plan_user_id') || 'user_001';
  
  // ★★★ 提交前保存当前题目答案（从 DOM 读取）★★★
  saveCurrentAnswerFromDOM();
  
  console.log('[提交考试] 最终答案:', JSON.stringify(_examAnswers));
  
  const btn = document.querySelector('.btn-submit');
  btn.disabled = true;
  btn.textContent = '提交中...';
  
  try {
    const resp = await fetch(`/study_plan/${userId}/phase/${phaseIndex}/exam/submit`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ answers: _examAnswers })
    });
    const data = await resp.json();
    
    if (resp.ok && data.success) {
      showExamResult(data);
    } else {
      _examActive = false;  // ★ 提交失败，清除答题标记
      // 获取服务端错误详情
      const errMsg = data.detail || data.message || '提交失败，请重试';
      alert(errMsg);
      btn.disabled = false;
      btn.textContent = '📤 提交答案';
    }
  } catch (e) {
    _examActive = false;
    console.error('提交考试答案失败:', e);
    alert('提交失败（网络错误），请重试');
    btn.disabled = false;
    btn.textContent = '📤 提交答案';
  }
}

// 处理考试通过
async function handleExamPass() {
  // ★★★ 关弹窗但不 ack，保留 notification 供后续评估报告弹窗使用 ★★★
  _examActive = false;
  if (window._examPollTimer) {
    clearTimeout(window._examPollTimer);
    window._examPollTimer = null;
  }
  document.getElementById('phaseCompleteModal').classList.remove('active');
  
  // ★★★ 检查是否有新版本（重规划已创建新版本时，切换到新版本查看）★★★
  const currentPlanId = _currentPlanId;
  setTimeout(async () => {
    // 先刷新版本树数据
    try {
      const vtResp = await fetch(`/study_plan/${getUserId()}/version-tree?plan_id=${encodeURIComponent(currentPlanId)}`);
      const vtData = await vtResp.json();
      if (vtData.status === 'success' && vtData.has_tree && vtData.versions && vtData.versions.length > 0) {
        _cachedVersionTree = vtData;
        if (vtData.active_version_plan_id && vtData.active_version_plan_id !== currentPlanId) {
          viewPlan(vtData.active_version_plan_id);
          setTimeout(checkPhaseNotification, 2000);
          return;
        }
      }
    } catch (e) { /* 版本树刷新失败，继续使用当前计划 */ }
    viewPlan(currentPlanId);
    setTimeout(checkPhaseNotification, 2000);
  }, 500);
}

// 查看本阶段评估（替代原来的直接"进入下一阶段"）
async function showAssessmentAfterExam() {
  // ★★★ 弹窗保持打开，显示等待状态 ★★★
  const bodyEl = document.getElementById('phaseCompleteBody');
  const modalActions = document.querySelector('.modal-actions');
  if (bodyEl) {
    bodyEl.innerHTML = '<div style="text-align:center;padding:40px"><span class="spinner-sm"></span><div style="margin-top:16px;color:#888">正在生成评估报告...</div></div>';
  }
  if (modalActions) {
    modalActions.innerHTML = '';
  }
  _examActive = false;
  if (window._examPollTimer) {
    clearTimeout(window._examPollTimer);
    window._examPollTimer = null;
  }
  
  // 等待评估生成，然后自动弹出评估窗
  const maxWait = 60; // 最多等60秒
  for (let i = 0; i < maxWait; i++) {
    await new Promise(r => setTimeout(r, 1000));
    try {
      const userId = document.getElementById('userId')?.value || localStorage.getItem('study_plan_user_id') || 'user_001';
      const resp = await fetch(`/study_plan/${userId}/notification`);
      const data = await resp.json();
      if (data.success && data.notification && data.notification.assessment_ready) {
        showPhaseCompleteModal(data.notification);
        return;
      }
    } catch (e) { /* 重试 */ }
  }
  // 超时，关弹窗，让正常轮询处理
  document.getElementById('phaseCompleteModal').classList.remove('active');
  alert('评估报告生成较慢，请稍后刷新页面查看');
  setTimeout(checkPhaseNotification, 1000);
}
async function retryExam() {
  console.log('[retryExam] 开始执行, _currentExamNotification:', _currentExamNotification);
  const notif = _currentExamNotification;
  if (notif) {
    const userId = document.getElementById('userId')?.value || localStorage.getItem('study_plan_user_id') || 'user_001';
    // ★★★ 先重置考试状态，否则后端拒绝提交 ★★★
    try {
      await fetch(`/study_plan/${userId}/notification/reset-exam`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phase_index: notif.phase_index })
      });
    } catch (e) {}
    // 再加载考题
    try {
      const resp = await fetch(`/study_plan/${userId}/phase/${notif.phase_index}/exam`);
      const data = await resp.json();
      if (data.success) {
        showExamModal(data.exam_data, notif.phase_index);

        alert('获取考试失败: ' + (data.message || data.detail || '未知错误'));

      console.error('重新获取考试失败:', e);

  }
}

// ==================== 合集播放器控制函数 ====================
var _studyCollData = null;
var _studyCollMonitor = null;

function studyCollLoadVideo(bvid) {
   reportResourceContext('video', bvid);
   fetch('/api/play-info?bvid=' + bvid + '&page=1').then(function(r) { return r.json(); }).then(function(result) {
     if (!result.success) return;
     var info = result.data;
     _studyCollData = { bvid: bvid, title: info.title || bvid, chapters: [], currentPage: 1 };

     var pages = info.pages || [];
     _studyCollData.chapters = pages.map(function(p) { return { page: p.page, title: p.title || 'P' + p.page }; });
     _studyCollData.chapters.sort(function(a, b) { return a.page - b.page; });

     document.getElementById('studyCollectionPlayer').style.display = 'block';
     document.getElementById('studyCollTitle').textContent = _studyCollData.title;
     studyCollRenderChapterList();
     studyCollInitVideoEvents();
     studyCollLoadPage(1);
     document.getElementById('studyCollectionPlayer').scrollIntoView({ behavior: 'smooth', block: 'center' });
   }).catch(function() {});
 }

function studyCollRenderChapterList() {
  if (!_studyCollData) return;
  var list = document.getElementById('studyCollChapterList');
  list.innerHTML = '';
  _studyCollData.chapters.forEach(function(ch) {
    var btn = document.createElement('button');
    btn.textContent = 'P' + ch.page + ' ' + ch.title;
    btn.style.cssText = 'padding:5px 10px;border:1px solid #ddd;border-radius:6px;cursor:pointer;font-size:11px;background:' +
      (ch.page === _studyCollData.currentPage ? '#fb7299;color:#fff;border-color:#fb7299' : '#fff;color:#333') + ';';
    btn.onclick = function() { studyCollLoadPage(ch.page); };
    list.appendChild(btn);
  });
}

function studyCollLoadPage(page) {
   if (!_studyCollData) return;
   _studyCollData.currentPage = page;
   var ch = _studyCollData.chapters.find(function(c) { return c.page === page; });
   if (!ch) return;

   // ★★★ 切章节时重置监控状态，并标记切换中以避免误回溯 ★★★
   if (_studyCollMonitor) {
     _studyCollMonitor.currentTime = 0;
     _studyCollMonitor._confusionAsked = false;
     _studyCollMonitor._switchingChapter = true;  // ★ 抑制回溯检测
   }

   document.getElementById('studyCollProgress').textContent = page + '/' + _studyCollData.chapters.length;
  document.getElementById('studyCollChapterIndicator').textContent = page + '/' + _studyCollData.chapters.length;
  document.getElementById('studyCollChapterGroup').style.display = _studyCollData.chapters.length > 1 ? 'flex' : 'none';
  studyCollRenderChapterList();

  var video = document.getElementById('studyCollVideo');
  fetch('/api/play-info?bvid=' + _studyCollData.bvid + '&page=' + page)
    .then(function(r) { return r.json(); })
    .then(function(result) {
      if (!result.success) { document.getElementById('studyCollStatus').textContent = '⚠️ 加载失败'; return; }
      var proxyUrl = '/api/stream?url=' + encodeURIComponent(result.data.streams[0].url);
      video.src = proxyUrl;
      video.load();
      video.play();
      // ★★★ 新章节开始播放后延迟解除回溯抑制 ★★★
      setTimeout(function() {
        if (_studyCollMonitor) _studyCollMonitor._switchingChapter = false;
      }, 2000);
      document.getElementById('studyCollStatus').textContent = '▶️ P' + page + ' ' + ch.title;
    }).catch(function() {
      document.getElementById('studyCollStatus').textContent = '⚠️ 加载失败';
    });
}

function studyCollPrev() { if (_studyCollData && _studyCollData.currentPage > 1) studyCollLoadPage(_studyCollData.currentPage - 1); }
function studyCollNext() { if (_studyCollData && _studyCollData.currentPage < _studyCollData.chapters.length) studyCollLoadPage(_studyCollData.currentPage + 1); }

function studyCollInitVideoEvents() {
  var video = document.getElementById('studyCollVideo');
  var state = { currentTime: 0, duration: 0, rewindCount: 0, pauseCount: 0, watchDuration: 0, isPlaying: false, startedPlaying: false, completionRate: 0, _confusionAsked: false };
  _studyCollMonitor = state;

  video.addEventListener('play', function() { state.isPlaying = true; if (!state.startedPlaying) state.startedPlaying = true; studyCollUpdateControls(); });
  video.addEventListener('pause', function() { if (state.isPlaying) { state.pauseCount++; state.isPlaying = false; } studyCollUpdateControls(); });
  video.addEventListener('timeupdate', function() {
    studyCollUpdateControls();
    if (!video.duration || isNaN(video.duration)) return;

    // ★★★ 章节切换中不触发回溯检测 ★★★
    if (state._switchingChapter) return;

    var cur = video.currentTime, prev = state.currentTime;
    state.duration = video.duration; state.currentTime = cur;
    state.completionRate = video.duration > 0 ? Math.round((cur / video.duration) * 100) : 0;
    // ★★★ 回溯检测（仅在同一章节内有效）★★★
    if (prev > 0 && cur < prev - 5) {
        state.rewindCount++;
        // ★★★ 每次回溯都弹窗，不限制次数 ★★★
        studyCollShowConfusion(_studyCollData.bvid, _studyCollData.title, prev, cur, _studyCollData.currentPage);
    }
    document.getElementById('studyCollRewind').textContent = '↩ ' + state.rewindCount + '次';
    document.getElementById('studyCollPause').textContent = '⏸️ ' + state.pauseCount + '次';
    document.getElementById('studyCollProgressTime').textContent = '⏱️ ' + state.watchDuration + 's (' + state.completionRate + '%)';
  });
  video.addEventListener('click', studyCollTogglePlay);

  if (window._studyCollTimer) clearInterval(window._studyCollTimer);
  window._studyCollTimer = setInterval(function() {
    if (!video.paused && !video.ended) state.watchDuration++;
  }, 1000);
}

function studyCollTogglePlay() { var v = document.getElementById('studyCollVideo'); if (v.paused) v.play(); else v.pause(); }
function studyCollSeekBar(e) { var v = document.getElementById('studyCollVideo'); if (!v.duration) return; var r = e.currentTarget.getBoundingClientRect(); v.currentTime = ((e.clientX - r.left) / r.width) * v.duration; }
function studyCollToggleMute() { var v = document.getElementById('studyCollVideo'); v.muted = !v.muted; document.getElementById('studyCollVolumeBtn').textContent = v.muted ? '🔇' : '🔊'; }
function studyCollFullscreen() { var el = document.querySelector('.study-coll-wrapper'); if (!document.fullscreenElement) el.requestFullscreen(); else document.exitFullscreen(); }
function studyCollUpdateControls() {
   var v = document.getElementById('studyCollVideo');
   document.getElementById('studyCollPlayBtn').textContent = v.paused ? '▶' : '⏸';
   if (v.duration) {
     document.getElementById('studyCollProgressFill').style.width = ((v.currentTime / v.duration) * 100) + '%';
     var fmt = function(s) { if (!s||s<0) return '0:00'; var m=Math.floor(s/60); return m+':'+(s%60<10?'0':'')+Math.floor(s%60); };
     document.getElementById('studyCollTimeDisplay').textContent = fmt(v.currentTime) + ' / ' + fmt(v.duration);
   }
 }

 var _studyCollPendingConfusion = null;

 function studyCollShowConfusion(bvid, title, fromSec, toSec, page) {
   _studyCollPendingConfusion = { bvid: bvid, title: title, from: fromSec, to: toSec, page: page || 1 };
   document.getElementById('studyCollConfusionInfo').innerHTML =
     '<strong>视频:</strong> ' + escapeHtml(title) + '<br>' +
     '<strong>回看位置:</strong> ' + fmtTime(fromSec) + ' → ' + fmtTime(toSec) +
     ' (倒退 ' + Math.round(fromSec - toSec) + '秒)';
   document.getElementById('studyCollConfusionOverlay').classList.add('active');
 }

 function fmtTime(s) { if (!s||s<0) return '0:00'; var m=Math.floor(s/60); return m+':'+(s%60<10?'0':'')+Math.floor(s%60); }

 function studyCollConfirmConfusion(isConfused) {
   document.getElementById('studyCollConfusionOverlay').classList.remove('active');
   var evt = _studyCollPendingConfusion;
   if (!evt) return;
   _studyCollPendingConfusion = null;

   var userId = document.getElementById('userId').value.trim() || 'user_001';
   fetch('/video/rewind-event', {
     method: 'POST',
     headers: { 'Content-Type': 'application/json' },
     body: JSON.stringify({
       user_id: userId,
       bvid: evt.bvid,
       video_title: evt.title,
       rewind_from: evt.from,
       rewind_to: evt.to,
       rewind_gap: Math.round(evt.from - evt.to),
       is_confused: isConfused,
       page: evt.page
     })
   }).then(function(r) { return r.json(); }).then(function(result) {
     if (result.success) console.log('✅ 回溯事件已上报, is_confused=' + isConfused);
   }).catch(function(e) { console.warn('⚠️ 上报失败:', e.message); });
 }

// ==================== 视频网格监控（同智能助手） ====================
var _spVideoMonitors = new Map();
var _spSeekThreshold = 120;  // 回溯超过120秒（2分钟）即判定为"回溯"
var _spMonitorTimer = null;

function initStudyPlanVideoGrid(panel) {
  // 清理旧监控状态
  _spVideoMonitors.clear();

  // 查找panel中的视频网格
  var cards = panel.querySelectorAll('.video-card[data-bvid]');
  if (!cards.length) return;

  cards.forEach(function(card) {
    var bvid = card.getAttribute('data-bvid');
    var idx = card.getAttribute('data-idx');
    var uid = bvid + '-' + idx;

    var state = {
      bvid: bvid,
      idx: idx,
      uid: uid,
      currentTime: 0,
      duration: 0,
      rewindCount: 0,
      pauseCount: 0,
      watchDuration: 0,
      isPlaying: false,
      startedPlaying: false,
      completionRate: 0,
      rewindEvents: [],
      _confusionAsked: false,
      _videoJustLoaded: false,
    };
    _spVideoMonitors.set(uid, state);

    var videoEl = document.getElementById('spv-' + uid);
    if (!videoEl) return;

    // 绑定事件
    spBindVideoEvents(videoEl, bvid, state, uid);

    // 异步加载视频流
    spLoadVideoStream(videoEl, bvid, state, uid);
  });

  // 启动定时器
  if (_spMonitorTimer) clearInterval(_spMonitorTimer);
  _spMonitorTimer = setInterval(function() {
    _spVideoMonitors.forEach(function(state) {
      if (state.isPlaying) state.watchDuration++;
      spUpdateMonitorUI(state);
    });
  }, 1000);
}

function spLoadVideoStream(videoEl, bvid, state, uid) {
  if (!videoEl || !bvid) return;

  fetch('/api/play-info?bvid=' + bvid + '&page=1')
    .then(function(r) { return r.json(); })
    .then(function(result) {
      if (!result.success) {
        spUpdateStatus(uid, '⚠️ 加载失败');
        return;
      }
      var info = result.data;
      state.duration = info.duration || 0;

      var proxyUrl = '/api/stream?url=' + encodeURIComponent(info.streams[0].url);

      // ★★★ 新视频加载前重置状态，防止误回溯 ★★★
      state.currentTime = 0;
      state._videoJustLoaded = true;

      videoEl.src = proxyUrl;
      videoEl.load();
      spUpdateStatus(uid, '▶️ 可播放');
    })
    .catch(function(e) {
      spUpdateStatus(uid, '⚠️ 加载失败');
      console.warn('⚠️ 学习计划视频加载失败 [' + bvid + ']:', e.message);
    });
}

function spBindVideoEvents(videoEl, bvid, state, uid) {
  if (!videoEl || !state) return;

  videoEl.addEventListener('play', function() {
    state.isPlaying = true;
    if (!state.startedPlaying) {
      state.startedPlaying = true;
      // ★★★ 上报摄像头资源上下文（用户开始播放视频）★★★
      reportResourceContext('video', bvid, '', 'open');
    }
  });

  videoEl.addEventListener('pause', function() {
    if (state.isPlaying) { state.pauseCount++; state.isPlaying = false; }
  });

  videoEl.addEventListener('timeupdate', function() {
    if (!videoEl.duration || isNaN(videoEl.duration)) return;

    // ★★★ 新视频刚加载时不触发回溯检测 ★★★
    if (state._videoJustLoaded) {
      state._videoJustLoaded = false;
      state.currentTime = videoEl.currentTime;
      spUpdateMonitorUI(state);
      return;
    }

    var cur = videoEl.currentTime;
    var prev = state.currentTime;
    state.duration = videoEl.duration;

    if (videoEl.duration > 0) {
      state.completionRate = Math.round((cur / videoEl.duration) * 100);
    }

    // ★★★ 回溯检测（仅在同一视频内有效）★★★
    if (prev > 0 && cur < prev - _spSeekThreshold) {
      state.rewindCount++;
      var evt = {
        from: prev, to: cur, gap: prev - cur,
        time: new Date().toISOString(), bvid: bvid
      };
      state.rewindEvents.push(evt);
      spUpdateStatus(uid, '↩ 回溯!');

      if (!state._confusionAsked) {
        state._confusionAsked = true;
        spShowConfusionDialog(bvid, state, evt);
      }
    }

    state.currentTime = cur;
    spUpdateMonitorUI(state);
  });
}

// 学习计划视频网格的困惑弹窗复用合集播放器的弹窗
 function spShowConfusionDialog(bvid, state, evt) {
   // 从卡片DOM获取视频标题
   var card = document.querySelector('.video-card[data-bvid="' + bvid + '"]');
   var title = '';
   if (card) {
     var titleEl = card.querySelector('.vc-title');
     if (titleEl) title = titleEl.textContent || '';
   }
   _studyCollPendingConfusion = {
     bvid: bvid, title: title || bvid,
     from: evt.from, to: evt.to, page: 1
   };
   document.getElementById('studyCollConfusionInfo').innerHTML =
     '<strong>视频:</strong> ' + escapeHtml(title || bvid) + '<br>' +
     '<strong>回看位置:</strong> ' + fmtTime(evt.from) + ' → ' + fmtTime(evt.to) +
     ' (倒退 ' + Math.round(evt.gap) + '秒)';
   document.getElementById('studyCollConfusionOverlay').classList.add('active');
 }

function spUpdateStatus(uid, text) {
  var el = document.getElementById('sps-' + uid);
  if (el) el.textContent = text;
}

function spUpdateMonitorUI(state) {
  if (!state) return;
  var uid = state.uid;
  var rewindEl = document.getElementById('spr-' + uid);
  var pauseEl = document.getElementById('spp-' + uid);
  var progressEl = document.getElementById('sppt-' + uid);
  if (rewindEl) rewindEl.textContent = '↩ ' + state.rewindCount + '次';
  if (pauseEl) pauseEl.textContent = '⏸️ ' + state.pauseCount + '次';
  if (progressEl) progressEl.textContent = '⏱️ ' + state.watchDuration + 's (' + state.completionRate + '%)';
}
