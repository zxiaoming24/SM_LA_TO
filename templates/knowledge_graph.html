<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识图谱</title>
<script src="https://unpkg.com/vis-network@9.1.9/dist/vis-network.min.js"></script>
<style>
:root {
  --primary: #667eea;
  --primary-dark: #5a6fd6;
  --secondary: #764ba2;
  --accent: #f093fb;
  --bg-dark: #0f0c29;
  --bg-mid: #1a1a4e;
  --glass-bg: rgba(255,255,255,0.12);
  --glass-border: rgba(255,255,255,0.18);
  --shadow: 0 8px 32px rgba(0,0,0,0.25);
  --radius: 14px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font);
  background: linear-gradient(135deg, var(--bg-dark) 0%, #302b63 50%, #24243e 100%);
  color: #e0e0f0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Animated background particles ── */
body::before, body::after {
  content: '';
  position: fixed;
  width: 400px; height: 400px;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.15;
  z-index: 0;
  pointer-events: none;
  animation: floatBg 20s ease-in-out infinite;
}
body::before {
  background: var(--primary);
  top: -100px; left: -100px;
  animation-delay: 0s;
}
body::after {
  background: var(--secondary);
  bottom: -100px; right: -100px;
  animation-delay: -10s;
}
@keyframes floatBg {
  0%, 100% { transform: translate(0, 0) scale(1); }
  25% { transform: translate(60px, -40px) scale(1.1); }
  50% { transform: translate(-30px, 60px) scale(0.95); }
  75% { transform: translate(40px, 30px) scale(1.05); }
}

/* Header */
.top-header {
  position: relative; z-index: 10;
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  color: #fff; padding: 14px 28px;
  display: flex; align-items: center;
  justify-content: space-between; flex-shrink: 0;
}
.top-header::after {
  content: ''; position: absolute; bottom: 0; left: 5%; width: 90%; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(102,126,234,0.4), transparent);
}
.top-header .title { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px;
                      background: linear-gradient(135deg, #fff, var(--accent));
                      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
                      background-clip: text; }
.top-header .subtitle { font-size: 12px; opacity: 0.5; -webkit-text-fill-color: rgba(255,255,255,0.6); }

/* Main layout */
.main { flex: 1; display: flex; overflow: hidden; position: relative; z-index: 1; }

/* ── Left panel ── */
.left-panel {
  width: 300px; min-width: 300px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-right: 1px solid rgba(255,255,255,0.06);
  display: flex; flex-direction: column; overflow: hidden;
}

/* Upload area */
.upload-area { padding: 18px 16px 14px; border-bottom: 1px solid rgba(255,255,255,0.06); }
.upload-zone {
  border: 2px dashed rgba(255,255,255,0.15);
  border-radius: var(--radius);
  padding: 22px 16px 18px;
  text-align: center; cursor: pointer;
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative; overflow: hidden;
}
.upload-zone::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(102,126,234,0.08), rgba(118,75,162,0.08));
  opacity: 0; transition: opacity 0.35s;
}
.upload-zone:hover::before, .upload-zone.dragover::before { opacity: 1; }
.upload-zone:hover, .upload-zone.dragover {
  border-color: var(--primary);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(102,126,234,0.15);
}
.upload-zone .icon { font-size: 34px; margin-bottom: 6px; display: block; animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
.upload-zone .text { font-size: 13px; color: rgba(255,255,255,0.7); }
.upload-zone .hint { font-size: 11px; color: rgba(255,255,255,0.35); margin-top: 4px; }
.upload-zone.uploading { pointer-events: none; opacity: 0.5; }
.upload-progress { display: none; margin-top: 14px; }
.upload-progress.active { display: block; }
.progress-bar { height: 4px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
.progress-bar .fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--primary), var(--accent));
  border-radius: 4px; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
}
.progress-bar .fill::after {
  content: ''; position: absolute; right: 0; top: 0; width: 20px; height: 100%;
  background: rgba(255,255,255,0.4); filter: blur(4px);
  animation: shimmer 1.2s ease-in-out infinite;
}
@keyframes shimmer { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
.progress-text { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 6px; text-align: center; }

/* Graph list */
.graph-list { flex: 1; overflow-y: auto; padding: 12px 14px; }
.graph-list .list-title { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.4);
                           text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }

.graph-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px; border-radius: var(--radius);
  cursor: default; margin-bottom: 8px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.05);
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
.graph-item:hover {
  background: rgba(255,255,255,0.07);
  border-color: rgba(102,126,234,0.2);
  transform: translateX(3px);
}
.graph-item.active {
  background: rgba(102,126,234,0.1);
  border-color: rgba(102,126,234,0.35);
  box-shadow: 0 0 20px rgba(102,126,234,0.05);
}
.graph-item .item-check { width: 15px; height: 15px; cursor: pointer; accent-color: var(--primary);
                          flex-shrink: 0; margin-top: 2px; filter: brightness(1.2); }
.graph-item .item-body { flex: 1; min-width: 0; }
.graph-item .item-title { font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.85); }
.graph-item .item-meta { font-size: 11px; color: rgba(255,255,255,0.35); margin-top: 4px; display: flex; gap: 12px; }
.graph-item .item-del { margin-left: auto; color: rgba(255,255,255,0.2); cursor: pointer; font-size: 14px;
                         padding: 2px 6px; border-radius: 6px; transition: all 0.2s; }
.graph-item .item-del:hover { color: #ff6b6b; background: rgba(255,107,107,0.12); }
.empty-hint { text-align: center; padding: 40px 16px; color: rgba(255,255,255,0.25); font-size: 13px; }

/* ── Right panel ── */
.graph-panel { flex: 1; position: relative;
               background: radial-gradient(ellipse at 30% 50%, rgba(102,126,234,0.04) 0%, transparent 60%),
                           radial-gradient(ellipse at 70% 50%, rgba(118,75,162,0.04) 0%, transparent 60%); }
#graph-canvas { width: 100%; height: 100%; }

/* Empty state with glowing animation */
.graph-empty-state { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
                     text-align: center; color: rgba(255,255,255,0.3); }
.graph-empty-state .big-icon { font-size: 72px; margin-bottom: 14px; display: block;
                                animation: floatIcon 4s ease-in-out infinite; }
@keyframes floatIcon { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
.graph-empty-state .text { font-size: 16px; font-weight: 500; }
.graph-empty-state .sub { font-size: 12px; margin-top: 6px; opacity: 0.6; }

/* ── Glassmorphism detail panel ── */
.detail-panel {
  position: absolute; right: 20px; top: 20px; width: 280px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.3);
  padding: 18px; display: none; z-index: 10;
  animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
.detail-panel.show { display: block; }
.detail-panel .close-btn { float: right; background: rgba(255,255,255,0.06); border: none; font-size: 16px;
                            cursor: pointer; color: rgba(255,255,255,0.5); line-height: 1;
                            padding: 4px 8px; border-radius: 8px; transition: all 0.2s; }
.detail-panel .close-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
.detail-panel .node-name { font-size: 17px; font-weight: 700; color: #fff; margin-bottom: 6px; }
.detail-panel .node-cat { display: inline-block; padding: 2px 12px; border-radius: 10px;
                           font-size: 11px; font-weight: 500; margin-bottom: 8px; }
.detail-panel .node-desc { font-size: 13px; color: rgba(255,255,255,0.6); line-height: 1.6; }
.detail-panel .node-rels { margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.06); }
.detail-panel .node-rels .rel-title { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.4);
                                       margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.detail-panel .node-rels .rel-item { font-size: 12px; color: rgba(102,126,234,0.8); padding: 5px 0;
                                      border-bottom: 1px solid rgba(255,255,255,0.04); }
.detail-panel .node-rels .rel-item:last-child { border: none; }

/* Mastery badge on glass */
.mastery-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px;
                 border-radius: 12px; font-size: 12px; font-weight: 500; margin: 6px 0 10px; }
.mastery-0 { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.4); }
.mastery-1 { background: rgba(76,175,80,0.15); color: #81c784; }
.mastery-2 { background: rgba(33,150,243,0.15); color: #64b5f6; }
.mastery-3 { background: rgba(255,152,0,0.15); color: #ffb74d; }
.mastery-4 { background: rgba(244,67,54,0.15); color: #ef9a9a; }
.mastery-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; }
.mastery-dot-0 { background: rgba(255,255,255,0.3); }
.mastery-dot-1 { background: #81c784; }
.mastery-dot-2 { background: #64b5f6; }
.mastery-dot-3 { background: #ffb74d; }
.mastery-dot-4 { background: #ef9a9a; }

/* Study plan button */
.btn-plan { display: block; width: 100%; padding: 10px; border: none; border-radius: 10px;
            font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 14px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative; overflow: hidden; }
.btn-plan.primary {
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  color: #fff;
  box-shadow: 0 4px 16px rgba(102,126,234,0.25);
}
.btn-plan.primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(102,126,234,0.35);
}
.btn-plan.primary:active { transform: translateY(0); }
.btn-plan:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

/* Category colors on dark */
.cat-概念 { background: rgba(33,150,243,0.15); color: #64b5f6; }
.cat-原理 { background: rgba(244,67,54,0.15); color: #ef9a9a; }
.cat-方法 { background: rgba(76,175,80,0.15); color: #81c784; }
.cat-工具 { background: rgba(255,152,0,0.15); color: #ffb74d; }
.cat-应用 { background: rgba(156,39,176,0.15); color: #ce93d8; }
.cat-default { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.5); }

/* Loading overlay */
.canvas-loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
                   z-index: 5; text-align: center; }
.canvas-loading .spinner { width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.08);
                            border-top-color: var(--primary); border-radius: 50%;
                            animation: spin 0.8s linear infinite; margin: 0 auto 10px; }
@keyframes spin { to { transform: rotate(360deg); } }
.canvas-loading .text { font-size: 13px; color: rgba(255,255,255,0.4); }

/* Toast with glass effect */
.toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-12px); z-index: 9999;
          padding: 12px 28px; border-radius: 12px; font-size: 14px; color: #fff;
          opacity: 0; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
          pointer-events: none;
          backdrop-filter: blur(12px);
          -webkit-backdrop-filter: blur(12px);
          border: 1px solid rgba(255,255,255,0.1); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
.toast.success { background: rgba(46,204,113,0.85); }
.toast.error { background: rgba(231,76,60,0.85); }
.toast.info { background: rgba(52,152,219,0.85); }

/* Scrollbar */
.graph-list::-webkit-scrollbar { width: 4px; }
.graph-list::-webkit-scrollbar-track { background: transparent; }
.graph-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
.graph-list::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

/* Layout toggle */
.layout-toggle { position: absolute; left: 16px; bottom: 16px; z-index: 10;
                 background: rgba(255,255,255,0.06);
                 backdrop-filter: blur(12px);
                 -webkit-backdrop-filter: blur(12px);
                 border: 1px solid rgba(255,255,255,0.08);
                 border-radius: 10px; padding: 8px 14px; cursor: pointer;
                 display: flex; align-items: center; gap: 6px;
                 font-size: 13px; color: rgba(255,255,255,0.6);
                 transition: all 0.25s; user-select: none; }
.layout-toggle:hover { border-color: var(--primary); color: #fff;
                        box-shadow: 0 4px 16px rgba(102,126,234,0.15); }
.layout-toggle .toggle-icon { font-size: 16px; }

/* Mastery legend */
.mastery-legend { position: absolute; right: 16px; bottom: 16px; z-index: 10;
                  background: rgba(255,255,255,0.06);
                  backdrop-filter: blur(12px);
                  -webkit-backdrop-filter: blur(12px);
                  border: 1px solid rgba(255,255,255,0.06);
                  border-radius: 10px; padding: 10px 14px;
                  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
                  font-size: 12px; color: rgba(255,255,255,0.5); line-height: 1.8; }
.mastery-legend .legend-title { font-weight: 600; color: rgba(255,255,255,0.4); margin-bottom: 2px; font-size: 11px; }
.mastery-legend .legend-item { display: flex; align-items: center; gap: 6px; }
.mastery-legend .legend-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; }

/* Merge bar */
.merge-bar { display: flex; align-items: center; gap: 8px; padding: 8px 0 10px;
             border-bottom: 1px solid rgba(255,255,255,0.06); margin-bottom: 8px; }
.merge-count { font-size: 12px; color: rgba(255,255,255,0.4); flex: 1; }
.merge-btn { padding: 6px 14px; border: none; border-radius: 8px; font-size: 12px;
             font-weight: 600; cursor: pointer;
             background: linear-gradient(135deg, var(--primary), var(--secondary));
             color: #fff; transition: all 0.25s; position: relative; }
.merge-btn:hover { opacity: 0.9; transform: translateY(-1px); }
.merge-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
.merge-btn.loading { opacity: 0.7; cursor: wait; }
.merge-btn .btn-spinner { display: none; width: 12px; height: 12px;
                          border: 2px solid rgba(255,255,255,0.2);
                          border-top-color: #fff; border-radius: 50%;
                          animation: spin 0.6s linear infinite; vertical-align: middle;
                          margin-right: 4px; }
.merge-btn.loading .btn-spinner { display: inline-block; }

/* Merge loading overlay */
.merge-overlay { display: none; position: absolute; inset: 0; z-index: 50;
                 background: rgba(15,12,41,0.6); backdrop-filter: blur(8px);
                 align-items: center; justify-content: center; }
.merge-overlay.show { display: flex; }
.merge-overlay .merge-loading-card { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1);
                                      border-radius: 16px; padding: 32px 48px; text-align: center;
                                      backdrop-filter: blur(16px); }
.merge-overlay .ml-spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.08);
                              border-top-color: var(--primary); border-radius: 50%;
                              animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
.merge-overlay .ml-text { font-size: 15px; color: rgba(255,255,255,0.8); font-weight: 500; }
.merge-overlay .ml-sub { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 6px; }

/* Floating sparkle particles (JS injected) */
.sparkle { position: fixed; pointer-events: none; z-index: 0;
            width: 3px; height: 3px; border-radius: 50%;
            background: rgba(255,255,255,0.3);
            animation: sparkleFloat linear infinite; }
@keyframes sparkleFloat {
  0% { transform: translateY(0) scale(0); opacity: 0; }
  20% { opacity: 1; }
  80% { opacity: 1; }
  100% { transform: translateY(-100vh) scale(1); opacity: 0; }
}
</style>
</head>
<body>

<div class="top-header">
  <div class="title">
    <span>🧠 知识图谱</span>
    <span class="subtitle">上传文档，AI自动提取知识点与关系</span>
  </div>
  <div class="user-area">
    <input id="userId" type="text" placeholder="用户ID" value="user_001"
           style="padding:6px 12px;border:none;border-radius:6px;
                  background:rgba(255,255,255,.2);color:#fff;font-size:13px;
                  width:140px;outline:none;">
  </div>
</div>

<div class="main">

  <!-- Left panel -->
  <div class="left-panel">
    <div class="upload-area">
      <div class="upload-zone" id="uploadZone">
        <div class="icon">📄</div>
        <div class="text">点击或拖拽文档到此处</div>
        <div class="hint">支持 PDF / Word / Markdown / TXT / XMind</div>
      </div>
      <div class="upload-progress" id="uploadProgress">
        <div class="progress-bar"><div class="fill" id="progressFill"></div></div>
        <div class="progress-text" id="progressText">正在解析文档...</div>
      </div>
    </div>

    <div class="graph-list" id="graphList">
      <div class="list-title">📚 已生成的图谱</div>
      <div class="empty-hint" id="emptyHint">暂无图谱，请上传文档生成</div>
    </div>
  </div>

  <!-- Right panel -->
  <div class="graph-panel" id="graphPanel">
    <!-- Merge loading overlay -->
    <div class="merge-overlay" id="mergeOverlay">
      <div class="merge-loading-card">
        <div class="ml-spinner"></div>
        <div class="ml-text" id="mlText">正在合并图谱...</div>
        <div class="ml-sub">LLM 正在分析知识点并进行智能融合</div>
      </div>
    </div>
    <div class="graph-empty-state" id="emptyState">
      <div class="big-icon">🧠</div>
      <div class="text">选择一个图谱或上传文档</div>
      <div class="sub">AI将从文档中自动提取知识点与关系</div>
    </div>
    <div class="canvas-loading" id="canvasLoading" style="display:none">
      <div class="spinner"></div>
      <div class="text">加载图谱数据...</div>
    </div>
    <div id="graph-canvas"></div>
    <div class="detail-panel" id="detailPanel">
      <button class="close-btn" onclick="closeDetail()">&times;</button>
      <div class="node-name" id="detailName"></div>
      <div class="node-cat" id="detailCat"></div>
      <div class="mastery-badge" id="detailMastery" style="display:none"></div>
      <div class="node-desc" id="detailDesc"></div>
      <div class="node-rels" id="detailRels"></div>
      <button class="btn-plan primary" id="btnGenPlan" onclick="generateStudyPlan()">
        🗺 生成学习计划
      </button>
    </div>

    <!-- Layout toggle -->
    <div class="layout-toggle" id="layoutToggle" title="切换布局模式" onclick="toggleLayout()">
      <span class="toggle-icon" id="toggleIcon">⊞</span>
      <span class="toggle-label" id="toggleLabel">层级</span>
    </div>

    <!-- Mastery legend -->
    <div class="mastery-legend" id="masteryLegend">
      <div class="legend-title">掌握度</div>
      <div class="legend-item"><span class="legend-dot" style="background:#ccc"></span>未接触</div>
      <div class="legend-item"><span class="legend-dot" style="background:#4caf50"></span>已了解</div>
      <div class="legend-item"><span class="legend-dot" style="background:#2196f3"></span>已理解</div>
      <div class="legend-item"><span class="legend-dot" style="background:#ff9800"></span>已应用</div>
      <div class="legend-item"><span class="legend-dot" style="background:#f44336"></span>已掌握</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let currentUser = 'user_001';
let graphs = [];
let currentGraphId = null;
let network = null;
let nodesDataSet = null;
let edgesDataSet = null;

// DOM refs
const userIdInput = document.getElementById('userId');
const uploadZone = document.getElementById('uploadZone');
const uploadProgress = document.getElementById('uploadProgress');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');
const graphListEl = document.getElementById('graphList');
const emptyHint = document.getElementById('emptyHint');
const emptyState = document.getElementById('emptyState');
const canvasLoading = document.getElementById('canvasLoading');
const container = document.getElementById('graph-canvas');
const detailPanel = document.getElementById('detailPanel');

// ── User ID ──
userIdInput.addEventListener('change', () => {
  currentUser = userIdInput.value.trim() || 'user_001';
  loadGraphs();
});

// ── Toast ──
function showToast(msg, type = 'info') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 3000);
}

// ── Upload ──
uploadZone.addEventListener('click', () => {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.pdf,.md,.doc,.docx,.txt,.xmind';
  input.onchange = () => { if (input.files.length) uploadFile(input.files[0]); };
  input.click();
});

uploadZone.addEventListener('dragover', e => {
  e.preventDefault();
  uploadZone.classList.add('dragover');
});
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('dragover');
  if (e.dataTransfer.files.length) uploadFile(e.dataTransfer.files[0]);
});

async function uploadFile(file) {
  const ext = '.' + file.name.split('.').pop().toLowerCase();
  const supported = ['.pdf', '.md', '.doc', '.docx', '.txt', '.xmind'];
  if (!supported.includes(ext)) {
    showToast('不支持的文件格式', 'error');
    return;
  }

  // Show progress
  uploadZone.classList.add('uploading');
  uploadProgress.classList.add('active');
  progressFill.style.width = '0%';
  progressText.textContent = '正在上传...';

  const formData = new FormData();
  formData.append('file', file);

  try {
    // Simulate progress
    let p = 0;
    const pi = setInterval(() => {
      p += 5;
      if (p > 60) clearInterval(pi);
      progressFill.style.width = p + '%';
    }, 200);

    const res = await fetch(`/knowledge-graph/upload/${currentUser}`, {
      method: 'POST',
      body: formData,
    });

    clearInterval(pi);
    progressFill.style.width = '90%';

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || '上传失败');
    }

    progressFill.style.width = '100%';
    progressText.textContent = '✅ 生成完成！';
    showToast('知识图谱生成成功！', 'success');

    await loadGraphs();
    // Auto select the newly created graph
    const graphs = await fetchGraphs();
    if (graphs.length > 0) {
      selectGraph(graphs[0].graph_id);
    }

    setTimeout(() => {
      uploadProgress.classList.remove('active');
      uploadZone.classList.remove('uploading');
      progressFill.style.width = '0%';
    }, 1500);

  } catch (e) {
    uploadZone.classList.remove('uploading');
    uploadProgress.classList.remove('active');
    progressFill.style.width = '0%';
    showToast(e.message || '生成失败', 'error');
  }
}

// ── Load graph list ──
async function fetchGraphs() {
  const res = await fetch(`/knowledge-graph/${currentUser}`);
  const data = await res.json();
  return data.success ? data.data : [];
}

let selectedMergeIds = new Set();

async function loadGraphs() {
  graphs = await fetchGraphs();
  // 清除已不存在的选中项
  const currentIds = new Set(graphs.map(g => g.graph_id));
  for (const id of selectedMergeIds) {
    if (!currentIds.has(id)) selectedMergeIds.delete(id);
  }
  renderGraphList();
}

function renderGraphList() {
  const title = graphListEl.querySelector('.list-title');
  // 保留 mergeBar 引用，如果被清掉了就重新创建
  let mergeBar = document.getElementById('mergeBar');

  graphListEl.innerHTML = '';
  graphListEl.appendChild(title);

  // 重新创建 mergeBar（因为 innerHTML='' 会移除之前的 DOM 节点）
  if (!mergeBar || !document.body.contains(mergeBar)) {
    mergeBar = document.createElement('div');
    mergeBar.id = 'mergeBar';
    mergeBar.className = 'merge-bar';
    mergeBar.style.display = 'none';
    mergeBar.innerHTML = `
      <span class="merge-count" id="mergeCount">已选 0 个</span>
      <button class="merge-btn" onclick="doMerge()">🔄 合并选中</button>
    `;
  }
  graphListEl.appendChild(mergeBar);

  if (graphs.length === 0) {
    graphListEl.appendChild(emptyHint);
    emptyHint.style.display = 'block';
    mergeBar.style.display = 'none';
    return;
  }
  emptyHint.style.display = 'none';

  // Show merge bar if 2+ graphs
  if (graphs.length >= 2) {
    mergeBar.style.display = 'flex';
    updateMergeBar();
  } else {
    mergeBar.style.display = 'none';
  }

  graphs.forEach(g => {
    const div = document.createElement('div');
    const isActive = g.graph_id === currentGraphId;
    const isChecked = selectedMergeIds.has(g.graph_id);
    div.className = 'graph-item' + (isActive ? ' active' : '');
    div.innerHTML = `
      <input type="checkbox" class="item-check" ${isChecked ? 'checked' : ''}>
      <div class="item-body">
        <div class="item-title">${escHtml(g.title || g.source_file)}</div>
        <div class="item-meta">
          <span>📄 ${escHtml(g.source_file)}</span>
          <span>🔗 ${g.node_count}节点 / ${g.edge_count}边</span>
          <span class="item-del" data-id="${g.graph_id}" title="删除">&times;</span>
        </div>
      </div>
    `;

    // Checkbox toggle
    const cb = div.querySelector('.item-check');
    cb.addEventListener('change', () => {
      if (cb.checked) {
        selectedMergeIds.add(g.graph_id);
      } else {
        selectedMergeIds.delete(g.graph_id);
      }
      updateMergeBar();
    });

    // Click body -> select graph
    div.querySelector('.item-body').addEventListener('click', () => {
      selectGraph(g.graph_id);
    });

    // Delete
    div.querySelector('.item-del').addEventListener('click', e => {
      e.stopPropagation();
      deleteGraph(g.graph_id);
    });

    graphListEl.appendChild(div);
  });
}

function updateMergeBar() {
  const count = selectedMergeIds.size;
  const countEl = document.getElementById('mergeCount');
  if (countEl) countEl.textContent = `已选 ${count} 个`;
  const btn = document.querySelector('.merge-btn');
  if (btn) btn.disabled = count < 2;
}

async function doMerge() {
  const ids = [...selectedMergeIds];
  if (ids.length < 2) {
    showToast('请至少选择2个图谱', 'error');
    return;
  }

  // Show persistent loading overlay
  const overlay = document.getElementById('mergeOverlay');
  const mlText = document.getElementById('mlText');
  overlay.classList.add('show');
  mlText.textContent = '正在合并图谱...';

  // Disable button
  const btn = document.querySelector('.merge-btn');
  if (btn) { btn.disabled = true; btn.classList.add('loading');
    btn.innerHTML = '<span class="btn-spinner"></span>合并中...'; }

  try {
    const res = await fetch(`/knowledge-graph/${currentUser}/merge`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ graph_ids: ids }),
    });

    if (!res.ok) {
      let errMsg = '合并失败';
      try { const err = await res.json(); errMsg = err.detail || errMsg; } catch(e) {}
      throw new Error(errMsg);
    }

    const data = await res.json();
    overlay.classList.remove('show');
    showToast('✅ 合并成功！', 'success');

    selectedMergeIds.clear();
    await loadGraphs();

    if (data.data && data.data.graph_id) {
      selectGraph(data.data.graph_id);
    }
  } catch (e) {
    overlay.classList.remove('show');
    showToast(`合并失败: ${e.message}`, 'error');
    console.error('Merge error:', e);
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.classList.remove('loading');
      btn.innerHTML = '🔄 合并选中';
    }
  }
}

async function deleteGraph(graphId) {
  if (!confirm('确定删除这个知识图谱吗？')) return;
  try {
    const res = await fetch(`/knowledge-graph/${currentUser}/${graphId}`, { method: 'DELETE' });
    if (!res.ok) throw new Error('删除失败');
    showToast('已删除', 'info');
    if (currentGraphId === graphId) {
      currentGraphId = null;
      clearGraph();
    }
    await loadGraphs();
  } catch (e) {
    showToast(e.message, 'error');
  }
}

// ── Select & render graph ──
async function selectGraph(graphId) {
  currentGraphId = graphId;
  renderGraphList();

  emptyState.style.display = 'none';
  canvasLoading.style.display = 'block';

  try {
    const res = await fetch(`/knowledge-graph/${currentUser}/${graphId}/enriched`);
    const data = await res.json();
    if (!data.success || !data.data) throw new Error('加载失败');

    renderGraph(data.data);
  } catch (e) {
    showToast('加载图谱数据失败', 'error');
    canvasLoading.style.display = 'none';
    emptyState.style.display = 'block';
  }
}

// ── Render vis-network ──
function renderGraph(graphData) {
  canvasLoading.style.display = 'none';

  const nodes = graphData.nodes || [];
  const edges = graphData.edges || [];

  if (nodes.length === 0) {
    emptyState.querySelector('.text').textContent = '该文档未提取到知识点';
    emptyState.style.display = 'block';
    return;
  }

  // 掌握度颜色（深色背景下的高饱和配色）
  const masteryColors = {
    0: { bg: 'rgba(255,255,255,0.08)', border: 'rgba(255,255,255,0.2)', text: 'rgba(255,255,255,0.75)', glow: 'rgba(255,255,255,0)' },
    1: { bg: 'rgba(46,204,113,0.15)', border: '#2ecc71', text: '#2ecc71', glow: 'rgba(46,204,113,0.3)' },
    2: { bg: 'rgba(52,152,219,0.15)', border: '#3498db', text: '#3498db', glow: 'rgba(52,152,219,0.3)' },
    3: { bg: 'rgba(243,156,18,0.15)', border: '#f39c12', text: '#f39c12', glow: 'rgba(243,156,18,0.3)' },
    4: { bg: 'rgba(231,76,60,0.15)', border: '#e74c3c', text: '#e74c3c', glow: 'rgba(231,76,60,0.3)' },
  };

  const visNodes = nodes.map(n => {
    const level = n.mastery_level !== undefined ? n.mastery_level : 0;
    const mc = masteryColors[level] || masteryColors[0];
    const isExtra = n._extra;

    // 根据节点数量动态调整大小
    const baseSize = nodes.length > 30 ? 18 : nodes.length > 15 ? 22 : 26;
    const size = isExtra ? baseSize * 0.6 : baseSize;

    return {
      id: n.id,
      label: n.name,
      title: `<div style="font-size:14px;font-weight:700;margin-bottom:4px">${escHtml(n.name)}</div>` +
             `<div style="font-size:12px;color:${mc.border};margin-bottom:4px">${escHtml(n.category || '')} · ${n.mastery_label || '未接触'}</div>` +
             `<div style="font-size:12px;color:#aaa;line-height:1.5">${escHtml(n.description || '')}</div>`,
      color: {
        background: mc.bg,
        border: mc.border,
        highlight: { background: 'rgba(102,126,234,0.2)', border: '#667eea' },
      },
      font: {
        color: mc.text,
        size: nodes.length > 20 ? 11 : 13,
        face: 'Microsoft YaHei, PingFang SC, sans-serif',
        strokeWidth: nodes.length > 20 ? 0 : 2,
        strokeColor: 'rgba(15,12,41,0.6)',
        bold: true,
      },
      borderWidth: isExtra ? 1 : 2.5,
      borderWidthSelected: 4,
      size: size,
      shape: 'box',
      widthConstraint: { maximum: nodes.length > 20 ? 100 : 140 },
      shadow: {
        enabled: true,
        color: mc.glow || 'rgba(255,255,255,0.05)',
        size: 12,
        x: 0,
        y: 0,
      },
      opacity: isExtra ? 0.5 : 1.0,
    };
  });

  const visEdges = edges.map(e => {
    const relColors = {
      '前置依赖': '#e74c3c',
      '包含': '#3498db',
      '关联': '#2ecc71',
      '举例': '#f39c12',
      '对比': '#9b59b6',
    };
    const relColor = relColors[e.relation] || 'rgba(255,255,255,0.25)';
    return {
      from: e.source,
      to: e.target,
      label: e.relation || '',
      color: {
        color: relColor,
        highlight: '#667eea',
        hover: '#667eea',
        opacity: 0.8,
      },
      font: {
        size: 11,
        color: relColor,
        strokeWidth: 3,
        strokeColor: 'rgba(15,12,41,0.8)',
        face: 'Microsoft YaHei',
        align: 'middle',
      },
      width: 2.5,
      selectionWidth: 4,
      hoverWidth: 3,
      smooth: {
        type: 'curvedCW',
        roundness: 0.12,
      },
      arrows: {
        to: {
          enabled: true,
          scaleFactor: 1,
          type: 'arrow',
        },
      },
      shadow: {
        enabled: true,
        color: relColor.replace(')', ',0.2)').replace('rgb', 'rgba') || 'rgba(255,255,255,0.05)',
        size: 6,
        x: 0,
        y: 0,
      },
    };
  });

  nodesDataSet = new vis.DataSet(visNodes);
  edgesDataSet = new vis.DataSet(visEdges);

  const data = { nodes: nodesDataSet, edges: edgesDataSet };

  const options = {
    nodes: {
      borderWidth: 2.5,
      borderWidthSelected: 4,
      shadow: { enabled: true, size: 12 },
      shapeProperties: { borderRadius: 8 },
    },
    edges: {
      shadow: { enabled: true, size: 6 },
    },
    layout: {
      hierarchical: {
        enabled: true,
        direction: 'LR',
        sortMethod: 'directed',
        nodeSpacing: 200,
        levelSeparation: 320,
        treeSpacing: 220,
        blockShifting: true,
        edgeMinimization: true,
        parentCentralization: true,
      },
    },
    physics: {
      enabled: false,
    },
    interaction: {
      hover: true,
      tooltipDelay: 150,
      navigationButtons: true,
      keyboard: true,
      dragNodes: true,
      zoomView: true,
    },
  };

  if (network) network.destroy();
  network = new vis.Network(container, data, options);

  // Click node -> show detail
  network.on('click', params => {
    if (params.nodes.length === 1) {
      showNodeDetail(params.nodes[0], nodes, edges);
    } else {
      closeDetail();
    }
  });

  // Resize
  setTimeout(() => network.fit({ animation: true }), 300);
}

function clearGraph() {
  if (network) { network.destroy(); network = null; }
  nodesDataSet = null;
  edgesDataSet = null;
  emptyState.style.display = 'block';
  emptyState.querySelector('.text').textContent = '选择一个图谱或上传文档';
  closeDetail();
}

// ── Layout toggle: hierarchical <-> force ──
let isHierarchical = true;

function toggleLayout() {
  if (!network || !nodesDataSet || !edgesDataSet) return;
  isHierarchical = !isHierarchical;

  const icon = document.getElementById('toggleIcon');
  const label = document.getElementById('toggleLabel');

  if (isHierarchical) {
    network.setOptions({
      layout: {
        hierarchical: {
          enabled: true,
          direction: 'LR',
          sortMethod: 'directed',
          nodeSpacing: 180,
          levelSeparation: 280,
          treeSpacing: 200,
          blockShifting: true,
          edgeMinimization: true,
          parentCentralization: true,
        },
      },
      physics: { enabled: false },
    });
    icon.textContent = '⊞';
    label.textContent = '层级';
  } else {
    network.setOptions({
      layout: { hierarchical: { enabled: false } },
      physics: {
        enabled: true,
        solver: 'forceAtlas2Based',
        forceAtlas2Based: {
          gravitationalConstant: -40,
          centralGravity: 0.005,
          springLength: 200,
          springConstant: 0.04,
          damping: 0.5,
        },
        stabilization: { iterations: 150 },
      },
    });
    icon.textContent = '⊟';
    label.textContent = '自由';
  }
  showToast(isHierarchical ? '已切换为层级排列' : '已切换为自由力导向', 'info');
}

// ── Node detail panel ──
let _selectedNode = null;
let _selectedRels = [];

function showNodeDetail(nodeId, allNodes, allEdges) {
  const node = allNodes.find(n => n.id === nodeId);
  if (!node) return;
  _selectedNode = node;

  document.getElementById('detailName').textContent = node.name || nodeId;
  const catEl = document.getElementById('detailCat');
  const catClass = `cat-${node.category}`;
  catEl.textContent = node.category || '未分类';
  catEl.className = `node-cat ${['cat-概念','cat-原理','cat-方法','cat-工具','cat-应用'].includes(catClass) ? catClass : 'cat-default'}`;

  // 掌握度
  const masteryEl = document.getElementById('detailMastery');
  const level = node.mastery_level !== undefined ? node.mastery_level : 0;
  const labels = {0:'未接触',1:'已了解',2:'已理解',3:'已应用',4:'已掌握'};
  masteryEl.style.display = 'inline-flex';
  masteryEl.className = `mastery-badge mastery-${level}`;
  masteryEl.innerHTML = `<span class="mastery-dot mastery-dot-${level}"></span> ${labels[level] || '未知'} (Lv.${level})`;

  document.getElementById('detailDesc').textContent = node.description || '暂无描述';

  // Related nodes
  const rels = allEdges.filter(e => e.source === nodeId || e.target === nodeId);
  _selectedRels = rels.map(r => {
    const otherId = r.source === nodeId ? r.target : r.source;
    const otherNode = allNodes.find(n => n.id === otherId);
    return { otherName: otherNode ? otherNode.name : otherId, relation: r.relation };
  });
  const relsContainer = document.getElementById('detailRels');
  if (rels.length > 0) {
    let html = '<div class="rel-title">🔗 关联知识点</div>';
    rels.forEach(r => {
      const otherId = r.source === nodeId ? r.target : r.source;
      const otherNode = allNodes.find(n => n.id === otherId);
      const otherName = otherNode ? otherNode.name : otherId;
      const arrow = r.source === nodeId ? '→' : '←';
      html += `<div class="rel-item">${arrow} ${escHtml(r.relation || '关联')} → ${escHtml(otherName)}</div>`;
    });
    relsContainer.innerHTML = html;
  } else {
    relsContainer.innerHTML = '';
  }

  // Enable/disable study plan button
  const btn = document.getElementById('btnGenPlan');
  btn.disabled = node._extra;  // 额外节点不可生成
  btn.textContent = node._extra ? '🗺 该知识点不在当前文档中' : '🗺 生成学习计划';

  detailPanel.classList.add('show');
}

function closeDetail() {
  detailPanel.classList.remove('show');
  _selectedNode = null;
  _selectedRels = [];
}

// ── Generate study plan for selected node ──
async function generateStudyPlan() {
  if (!_selectedNode) return;
  const node = _selectedNode;
  const kpName = node.name;
  const desc = node.description ? `（${node.description}）` : '';
  const cat = node.category ? `[${node.category}]` : '';

  // 如果有关系信息，也带上
  const graphData = network ? null : null;  // 保留，后续可扩展
  const relHint = _selectedRels && _selectedRels.length > 0
    ? `，关联知识点: ${_selectedRels.slice(0,3).map(r => r.otherName).join('、')}`
    : '';

  showToast(`正在为「${kpName}」生成学习计划...`, 'info');

  try {
    const res = await fetch('/study_plan/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        user_id: currentUser,
        user_input: `系统地学习「${kpName}」${cat}${desc}${relHint}`,
        enable_tts: false,
        ignore_weak_points: true,
        focus_weak_points: false,
      }),
    });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || '生成失败');
    }

    const data = await res.json();
    if (data.weak_points_detected) {
      showToast('已检测到薄弱点，学习计划已针对性调整', 'info');
    }
    showToast(`✅ 「${kpName}」学习计划已生成！`, 'success');

    // 跳转到学习计划页面
    if (window.parent && window.parent.switchTab) {
      window.parent.switchTab('plan');
    }

  } catch (e) {
    showToast(`生成计划失败: ${e.message}`, 'error');
  }
}

// ── Utilities ──
function escHtml(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

loadGraphs();

  const container = document.body;
  for (let i = 0; i < 30; i++) {
    const el = document.createElement('div');
    el.className = 'sparkle';
    el.style.left = Math.random() * 100 + '%';
    el.style.top = Math.random() * 100 + '%';
    el.style.width = el.style.height = (1 + Math.random() * 2) + 'px';
    el.style.animationDuration = (8 + Math.random() * 12) + 's';
    el.style.animationDelay = (Math.random() * 10) + 's';
    el.style.opacity = 0.2 + Math.random() * 0.3;
    container.appendChild(el);
  }
})();
