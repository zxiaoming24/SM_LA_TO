<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学习效果评估</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
       background: #f5f7fa; color: #1a1a2e; min-height: 100vh; }

.header { background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);
           color: #fff; padding: 20px 40px; display: flex; align-items: center;
           justify-content: space-between; }
.header h1 { font-size: 24px; font-weight: 600; }
.header .user-info { display: flex; align-items: center; gap: 12px; }
.header .user-info input { padding: 8px 14px; border: none; border-radius: 8px;
                           background: rgba(255,255,255,0.2); color: #fff;
                           font-size: 14px; width: 180px; outline: none; }
.header .user-info input::placeholder { color: rgba(255,255,255,0.6); }
.header .user-info button { padding: 8px 18px; border: none; border-radius: 8px;
                            background: rgba(255,255,255,0.25); color: #fff;
                            cursor: pointer; font-size: 14px; transition: all .2s; }
.header .user-info button:hover { background: rgba(255,255,255,0.35); }

.container { max-width: 960px; margin: 0 auto; padding: 24px 16px; }

/* Generate Button */
.gen-section { text-align: center; padding: 40px; background: #fff; border-radius: 16px;
               box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 24px; }
.gen-section p { color: #888; font-size: 14px; margin-bottom: 16px; }
.btn-gen { padding: 14px 40px; border: none; border-radius: 12px;
            background: linear-gradient(135deg, #00b894, #00cec9); color: #fff;
            font-size: 16px; font-weight: 600; cursor: pointer; transition: all .2s; }
.btn-gen:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,184,148,0.3); }
.btn-gen:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn-gen .spinner { display: inline-block; width: 18px; height: 18px;
                     border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff;
                     border-radius: 50%; animation: spin .8s linear infinite;
                     vertical-align: middle; margin-right: 8px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Overall Score Card */
.overall-card { background: #fff; border-radius: 16px; padding: 32px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 24px;
                display: none; }
.overall-card.show { display: block; }
.overall-card .score-row { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
.overall-card .score-ring { width: 120px; height: 120px; border-radius: 50%;
                            display: flex; align-items: center; justify-content: center;
                            font-size: 36px; font-weight: 700; color: #fff;
                            flex-shrink: 0; }
.overall-card .score-info { flex: 1; min-width: 200px; }
.overall-card .score-info .status { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
.overall-card .score-info .summary { font-size: 14px; line-height: 1.7; color: #555; }

/* Section */
.section { background: #fff; border-radius: 16px; padding: 24px;
           box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 16px;
           display: none; }
.section.show { display: block; }
.section .section-title { font-size: 18px; font-weight: 600; margin-bottom: 16px;
                          color: #1a1a2e; display: flex; align-items: center; gap: 8px; }
.section .section-title .badge { font-size: 12px; padding: 2px 10px; border-radius: 10px;
                                 color: #fff; }

/* Dimension Cards */
.dim-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 12px; }
.dim-card { padding: 16px; border-radius: 12px; border: 1px solid #eee;
             transition: all .2s; }
.dim-card:hover { border-color: #00b894; }
.dim-card .dim-header { display: flex; justify-content: space-between; align-items: center;
                         margin-bottom: 8px; }
.dim-card .dim-name { font-size: 14px; font-weight: 600; color: #333; }
.dim-card .dim-score { font-size: 18px; font-weight: 700; }
.dim-card .dim-analysis { font-size: 13px; line-height: 1.6; color: #666; }
.dim-card .dim-trend { font-size: 11px; padding: 2px 8px; border-radius: 8px; }
.btn-regen { padding: 4px 10px; border: none; border-radius: 6px; font-size: 11px; 
             cursor: pointer; background: #f0f4ff; color: #667eea; transition: all .2s; }
.btn-regen:hover { background: #e0e7ff; }
.btn-regen.loading { opacity: 0.5; cursor: not-allowed; }

/* Weak Points */
.weak-list { display: flex; flex-direction: column; gap: 12px; }
.weak-item { padding: 16px; border-radius: 12px; border-left: 4px solid #e74c3c;
              background: #fef9f9; }
.weak-item .weak-point { font-size: 14px; font-weight: 600; color: #e74c3c;
                          margin-bottom: 6px; }
.weak-item .weak-detail { font-size: 13px; line-height: 1.5; color: #666; }
.weak-item .weak-priority { display: inline-block; font-size: 11px; padding: 2px 8px;
                             border-radius: 8px; color: #fff; margin-top: 6px; }

/* Adjustments */
.adj-box { padding: 16px; border-radius: 12px; background: #f0fdf4; margin-bottom: 12px; }
.adj-box .adj-label { font-size: 13px; font-weight: 600; color: #00b894; margin-bottom: 6px; }
.adj-box .adj-text { font-size: 13px; line-height: 1.6; color: #555; }
.adj-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.adj-tag { padding: 3px 10px; border-radius: 10px; font-size: 12px;
            background: #e8f8f5; color: #00b894; }

/* Plan Optimization */
.plan-box { padding: 16px; border-radius: 12px; background: #f0f4ff; }
.plan-box .plan-label { font-size: 13px; font-weight: 600; color: #667eea; margin-bottom: 6px; }
.plan-box .plan-text { font-size: 13px; line-height: 1.6; color: #555; }

/* Buttons */
.action-buttons { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
.btn-apply { padding: 10px 28px; border: none; border-radius: 10px;
             font-size: 14px; font-weight: 500; cursor: pointer; transition: all .2s;
             background: #00b894; color: #fff; }
.btn-apply:hover { background: #00a383; }
.btn-apply:disabled { opacity: 0.5; cursor: not-allowed; }

/* Loading */
.loading { text-align: center; padding: 60px 20px; color: #888; }
.loading .spinner-lg { width: 40px; height: 40px; border: 4px solid #f0f0f0;
                       border-top-color: #00b894; border-radius: 50%;
                       animation: spin .8s linear infinite; margin: 0 auto 12px; }

/* History */
.history-list { margin-top: 24px; }
.history-item { display: flex; justify-content: space-between; align-items: center;
                padding: 12px 16px; border-radius: 8px; background: #f8f9fa;
                margin-bottom: 8px; cursor: pointer; transition: all .2s; }
.history-item:hover { background: #eef0ff; }
.history-item .hi-time { font-size: 13px; color: #888; }
.history-item .hi-score { font-weight: 600; }

/* ==================== 可视化 ==================== */
.viz-container { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.viz-container .viz-card { padding: 16px; border-radius: 12px; border: 1px solid #eee; }
.viz-card .viz-title { font-size: 14px; font-weight: 600; color: #333; margin-bottom: 12px; }
.viz-card .viz-chart { width: 100%; height: 220px; }
.viz-card.full { grid-column: 1 / -1; }

/* 进度条 */
.progress-bar-wrapper { margin-bottom: 10px; }
.progress-bar-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
.progress-bar-label .pb-name { color: #333; }
.progress-bar-label .pb-score { font-weight: 600; }
.progress-bar-track { height: 8px; background: #f0f0f0; border-radius: 4px; overflow: hidden; }
.progress-bar-fill { height: 100%; border-radius: 4px; transition: width .8s ease; }

/* 仪表盘 */
.dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.dashboard-item { text-align: center; padding: 16px; border-radius: 12px; background: #f8f9fa; }
.dashboard-item .di-value { font-size: 28px; font-weight: 700; }
.dashboard-item .di-label { font-size: 12px; color: #888; margin-top: 4px; }

/* 薄弱点热力图 */
.heatmap-item { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 8px; margin-bottom: 6px; }
.heatmap-item .hm-point { flex: 1; font-size: 13px; }
.heatmap-item .hm-bar { flex: 2; height: 20px; border-radius: 4px; min-width: 60px; }
.heatmap-item .hm-priority { font-size: 11px; white-space: nowrap; color: #888; }

/* ==================== 通知徽标 ==================== */
.notif-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 20px; background: rgba(255,255,255,0.2); color: #fff; cursor: pointer; font-size: 13px; transition: all .2s; }
.notif-badge:hover { background: rgba(255,255,255,0.35); }
.notif-badge .nb-count { background: #e74c3c; color: #fff; padding: 0 6px; border-radius: 10px; font-size: 11px; min-width: 18px; text-align: center; }
.notif-dot { width: 8px; height: 8px; background: #e74c3c; border-radius: 50%; display: inline-block; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
</style>
</head>
<body>

<div class="header">
  <h1>📊 学习效果评估</h1>
  <div class="user-info">
    <span class="notif-badge" id="notifBadge" onclick="showNotifications()" style="display:none;">
      🔔 <span class="notif-dot" id="notifDot"></span> <span id="notifCount">0</span>
    </span>
    <input id="userId" type="text" placeholder="用户ID" value="user_001"
           onkeydown="if(event.key==='Enter')loadLatest()">
    <button onclick="loadLatest()">查询</button>
  </div>
</div>

<div class="container">
  <div class="gen-section">
    <p>基于特征画像、知识点掌握、错题统计、学习记录等多维数据，由AI生成综合评估报告</p>
    <button class="btn-gen" id="btnGenerate" onclick="generateAssessment()">
      🚀 生成最新评估报告
    </button>
  </div>

  <div id="assessmentArea"></div>
</div>

<script>
function getUserId() {
  return document.getElementById('userId').value.trim() || 'user_001';
}

async function loadLatest() {
  const area = document.getElementById('assessmentArea');
  area.innerHTML = '<div class="loading"><div class="spinner-lg"></div><p>加载中...</p></div>';

  try {
    const resp = await fetch(`/assessment/latest/${getUserId()}`);
    const data = await resp.json();
    if (data.success && data.assessment) {
      renderAssessment(data.assessment);
    } else {
      area.innerHTML = '<div class="gen-section"><p style="color:#aaa;">暂无评估报告，点击上方按钮生成</p></div>';
    }
  } catch (e) {
    area.innerHTML = '<div class="gen-section"><p style="color:#e74c3c;">加载失败</p></div>';
  }
}

async function generateAssessment() {
  const btn = document.getElementById('btnGenerate');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>AI 分析中...';
  document.getElementById('assessmentArea').innerHTML = '';

  try {
    const resp = await fetch(`/assessment/generate/${getUserId()}`, { method: 'POST' });
    const data = await resp.json();
    if (data.success) {
      renderAssessment(data.assessment);
    } else {
      alert('生成失败');
    }
  } catch (e) {
    alert('生成失败: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '🚀 生成最新评估报告';
  }
}

let currentAssessmentId = '';

function renderAssessment(a) {
  currentAssessmentId = a.assessment_id || '';
  
  // ★★★ 兼容两种数据格式：原来的 overall 对象 和 重评后的独立字段 ★★★
  // ★★★ 优先使用重评后的独立字段（如果存在），否则使用 overall 对象 ★★★
  const overall = a.overall || {};
  const overallStatus = a.overall_level || overall.status || '';
  const overallScore = a.overall_score !== undefined ? a.overall_score : (overall.score !== undefined ? overall.score : 0);
  const overallSummary = a.overall_summary || overall.summary || '';
  
  const dims = a.dimensions || [];
  const weak = a.weak_points || [];
  const adj = a.adjustments || {};
  const plan = a.plan_optimization || {};

  const score = overallScore;
  const scoreColor = score >= 80 ? '#00b894' : score >= 60 ? '#fdcb6e' : '#e74c3c';
  const statusMap = {
    '快速进步': { emoji: '🚀', color: '#00b894' },
    '稳步提升': { emoji: '📈', color: '#00b894' },
    '遇到瓶颈': { emoji: '🧗', color: '#fdcb6e' },
    '需要干预': { emoji: '⚠️', color: '#e74c3c' },
    'S': { emoji: '🏆', color: '#00b894' },
    'A': { emoji: '🥇', color: '#00b894' },
    'B': { emoji: '🥈', color: '#fdcb6e' },
    'C': { emoji: '🥉', color: '#e74c3c' },
    'D': { emoji: '⚠️', color: '#e74c3c' }
  };
  const st = statusMap[overallStatus] || { emoji: '📊', color: '#888' };

  const html = `
    <div class="overall-card show">
      <div class="score-row">
        <div class="score-ring" style="background: ${scoreColor}">${score}</div>
        <div class="score-info">
          <div class="status" style="color: ${st.color}">${st.emoji} ${overallStatus || '未知'} <button class="btn-regen" onclick="reRegeneratePart('overall')" title="重新评估总体等级">🔄 重评</button></div>
          <div class="summary">${escapeHtml(overallSummary || '')}</div>
        </div>
      </div>
    </div>

    <div class="section show">
      <div class="section-title">📐 分维度评估</div>
      <div class="dim-grid">
        ${dims.map((d, idx) => {
          const ds = d.score || 0;
          const dc = ds >= 80 ? '#00b894' : ds >= 60 ? '#fdcb6e' : '#e74c3c';
          const trendIcon = d.trend === '上升' ? '📈' : d.trend === '下降' ? '📉' : '➡️';
          return `
            <div class="dim-card">
              <div class="dim-header">
                <span class="dim-name">${escapeHtml(d.name || '')}</span>
                <span class="dim-score" style="color:${dc}">${ds}</span>
              </div>
              <div class="dim-analysis">${escapeHtml(d.analysis || '')}</div>
              <div style="margin-top:8px;display:flex;gap:8px;align-items:center">
                <span class="dim-trend" style="background:${dc}20;color:${dc}">${trendIcon} ${d.trend || '稳定'}</span>
                <button class="btn-regen" onclick="reRegeneratePart('dimension', ${idx})" title="重新评估此维度">🔄 重评</button>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>

    <div class="section show">
      <div class="section-title">🎯 薄弱环节定位 <span class="badge" style="background:#e74c3c">${weak.length}项</span></div>
      <div class="weak-list">
        ${weak.map((w, idx) => {
          const pColor = w.priority === '高' ? '#e74c3c' : w.priority === '中' ? '#fdcb6e' : '#00b894';
          return `
            <div class="weak-item">
              <div class="weak-point">${escapeHtml(w.point || '')} <button class="btn-regen" onclick="reRegeneratePart('weak_point', ${idx})" title="重新识别此薄弱点">🔄 重评</button></div>
              <div class="weak-detail"><strong>表现:</strong> ${escapeHtml(w.performance || '')}</div>
              <div class="weak-detail"><strong>原因:</strong> ${escapeHtml(w.possible_reason || '')}</div>
              <span class="weak-priority" style="background:${pColor}">${w.priority || '中'}优先级</span>
            </div>
          `;
        }).join('')}
      </div>
    </div>

    <div class="section show">
      <div class="section-title">🔄 动态调整建议</div>
      ${adj.resource_adjustment ? `
    <div class="adj-box">
      <div class="adj-label">📚 资源调整</div>
      <div class="adj-text">${escapeHtml(adj.resource_adjustment.reason || '')}</div>
      <div class="adj-tags">
        ${(adj.resource_adjustment.increase || []).map(t => `<span class="adj-tag">+ ${t}</span>`).join('')}
        ${(adj.resource_adjustment.decrease || []).map(t => `<span class="adj-tag" style="background:#fef0f0;color:#e74c3c">- ${t}</span>`).join('')}
      </div>
      <div class="adj-actions" style="margin-top:10px;display:flex;gap:8px;">
        <button class="btn-adopt" onclick="adoptSuggestion('resource_adjustment','${escapeHtml(adj.resource_adjustment.reason || '')}',this)" style="padding:6px 14px;background:#11998e;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px;">✅ 采纳</button>
        <button class="btn-reject" onclick="rejectSuggestion('resource_adjustment','${escapeHtml(adj.resource_adjustment.reason || '')}')" style="padding:6px 14px;background:#e74c3c;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px;">❌ 不采纳</button>
      </div>
    </div>
  ` : ''}
  ${adj.difficulty_adjustment ? `
    <div class="adj-box" style="background:#fef9f0">
      <div class="adj-label" style="color:#fdcb6e">⚡ 难度调整</div>
      <div class="adj-text">${escapeHtml(adj.difficulty_adjustment.action || '')} — ${escapeHtml(adj.difficulty_adjustment.reason || '')}</div>
      <div class="adj-actions" style="margin-top:10px;display:flex;gap:8px;">
        <button class="btn-adopt" onclick="adoptSuggestion('difficulty_adjustment','${escapeHtml(adj.difficulty_adjustment.action + ' — ' + adj.difficulty_adjustment.reason)}',this)" style="padding:6px 14px;background:#11998e;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px;">✅ 采纳</button>
        <button class="btn-reject" onclick="rejectSuggestion('difficulty_adjustment','${escapeHtml(adj.difficulty_adjustment.action + ' — ' + adj.difficulty_adjustment.reason)}')" style="padding:6px 14px;background:#e74c3c;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px;">❌ 不采纳</button>
      </div>
    </div>
  ` : ''}
  ${adj.knowledge_priority && adj.knowledge_priority.length ? `
    <div class="adj-box" style="background:#f0f4ff">
      <div class="adj-label" style="color:#667eea">📖 知识点优先级</div>
      <div class="adj-tags">
        ${adj.knowledge_priority.map(t => `
          <span class="adj-tag" style="background:#eef0ff;color:#667eea">
            ${escapeHtml(t)}
            <button onclick="adoptSuggestion('knowledge_priority','${escapeHtml(t)}')" style="margin-left:6px;padding:1px 6px;background:transparent;color:#11998e;border:1px solid #11998e;border-radius:4px;cursor:pointer;font-size:10px;">+采纳</button>
          </span>
        `).join('')}
      </div>
    </div>
  ` : ''}
  ${adj.pace_advice ? `
    <div class="adj-box" style="background:#fef9f9">
      <div class="adj-label" style="color:#e74c3c">🏃 节奏建议</div>
      <div class="adj-text">${escapeHtml(adj.pace_advice)}</div>
      <div class="adj-actions" style="margin-top:10px;display:flex;gap:8px;">
        <button class="btn-adopt" onclick="adoptSuggestion('pace_advice','${escapeHtml(adj.pace_advice)}',this)" style="padding:6px 14px;background:#11998e;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px;">✅ 采纳</button>
        <button class="btn-reject" onclick="rejectSuggestion('pace_advice','${escapeHtml(adj.pace_advice)}')" style="padding:6px 14px;background:#e74c3c;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px;">❌ 不采纳</button>
      </div>
    </div>
  ` : ''}
    </div>

    <div class="section show">
      <div class="section-title">📋 学习计划优化</div>
      <div class="plan-box">
        <div class="plan-label">${plan.needs_adjustment ? '🔄 建议调整' : '✅ 当前计划合理'}</div>
        ${plan.suggestions && plan.suggestions.length ? `
          <ul style="margin-top:8px;padding-left:20px">
            ${plan.suggestions.map(s => `<li style="font-size:13px;line-height:1.8;color:#555">${escapeHtml(s)}</li>`).join('')}
          </ul>
        ` : ''}
      </div>
    </div>

    <div class="section show" id="adoptedSection">
      <div class="section-title">✅ 已采纳的建议 <span class="badge" style="background:#11998e" id="adoptedCount">0</span></div>
      <div id="adoptedList">
        <p style="color:#aaa;font-size:13px;text-align:center;padding:12px;">暂无已采纳的建议</p>
      </div>
    </div>

    <div class="action-buttons">
      <button class="btn-apply" onclick="applyAdjustments()">🔄 应用调整建议</button>
    </div>

    <!-- ==================== 数据可视化 ==================== -->
    <div class="section show" id="vizSection">
      <div class="section-title">📊 评估数据可视化</div>
      
      <!-- 仪表盘 -->
      <div class="section-title" style="font-size:14px;margin-top:16px;">🏆 学习状态仪表盘</div>
      <div class="dashboard-grid" id="dashboardGrid">
        <div class="dashboard-item"><div class="di-value" style="color:${scoreColor}" id="dashScore">${score}</div><div class="di-label">综合评分</div></div>
        <div class="dashboard-item"><div class="di-value" style="color:${scoreColor}" id="dashDims">${dims.length}</div><div class="di-label">评估维度</div></div>
        <div class="dashboard-item"><div class="di-value" style="color:#e74c3c" id="dashWeak">${weak.length}</div><div class="di-label">薄弱环节</div></div>
        <div class="dashboard-item"><div class="di-value" style="color:#667eea">${(adj.knowledge_priority || []).length}</div><div class="di-label">优先知识点</div></div>
        <div class="dashboard-item"><div class="di-value" style="color:#fdcb6e">${plan.needs_adjustment ? '⚠️' : '✅'}</div><div class="di-label">计划合理性</div></div>
      </div>

      <!-- 雷达图 + 进度条 -->
      <div class="viz-container" style="margin-top:16px;">
        <div class="viz-card">
          <div class="viz-title">🎯 8维度能力雷达图</div>
          <div class="viz-chart"><canvas id="radarChart"></canvas></div>
        </div>
        <div class="viz-card">
          <div class="viz-title">📈 各维度得分</div>
          <div id="progressBars"></div>
        </div>
      </div>

      <!-- 薄弱点热力图 -->
      <div class="viz-card full" style="margin-top:12px;">
        <div class="viz-title">🔥 薄弱点优先级热力图</div>
        <div id="heatmapContainer"></div>
      </div>
    </div>

    <!-- ==================== 通知列表弹窗 ==================== -->
    <div id="notifModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:1000;justify-content:center;align-items:center;" onclick="if(event.target===this)this.style.display='none'">
      <div style="background:#fff;border-radius:16px;padding:24px;max-width:480px;width:90%;max-height:80vh;overflow-y:auto;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <h3 style="font-size:18px;">🔔 通知</h3>
          <button onclick="document.getElementById('notifModal').style.display='none'" style="border:none;background:none;font-size:20px;cursor:pointer;">×</button>
        </div>
        <div id="notifList" style="font-size:13px;color:#888;text-align:center;">暂无通知</div>
      </div>
    </div>
  `;

  document.getElementById('assessmentArea').innerHTML = html;

  // 加载已采纳的建议
  loadAdoptedSuggestions();
}

async function loadAdoptedSuggestions() {
  try {
    const resp = await fetch(`/assessment/adopted/${getUserId()}`);
    const data = await resp.json();
    if (!data.success) return;

    const list = document.getElementById('adoptedList');
    const count = document.getElementById('adoptedCount');
    const adopted = data.adopted_suggestions || [];
    const weights = data.adoption_weights || {};

    count.textContent = adopted.length;

    // ★★★ 构建影响预览 ★★★
    let impactHtml = '';
    if (adopted.length > 0) {
      impactHtml = `
        <div style="padding:14px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;margin-bottom:16px;">
          <div style="font-size:13px;font-weight:600;color:#166534;margin-bottom:10px;">📊 采纳建议的影响效果</div>
          <table style="width:100%;font-size:12px;border-collapse:collapse;">
      `;

      if (weights.increase_resource_types && weights.increase_resource_types.length > 0) {
        impactHtml += `
          <tr><td style="padding:6px 0;color:#15803d;width:100px;">📈 增加资源</td>
          <td style="padding:6px 0;">${weights.increase_resource_types.map(t => `<span style="display:inline-block;padding:2px 8px;background:#dcfce7;color:#166534;border-radius:4px;margin:1px;font-size:11px;">${t}</span>`).join('')}</td></tr>`;
      }
      if (weights.decrease_resource_types && weights.decrease_resource_types.length > 0) {
        impactHtml += `
          <tr><td style="padding:6px 0;color:#dc2626;width:100px;">📉 减少资源</td>
          <td style="padding:6px 0;">${weights.decrease_resource_types.map(t => `<span style="display:inline-block;padding:2px 8px;background:#fee2e2;color:#dc2626;border-radius:4px;margin:1px;font-size:11px;">${t}</span>`).join('')}</td></tr>`;
      }
      if (weights.difficulty) {
        impactHtml += `
          <tr><td style="padding:6px 0;color:#d97706;width:100px;">⚡ 难度倾向</td>
          <td style="padding:6px 0;"><span style="display:inline-block;padding:2px 8px;background:#fef3c7;color:#d97706;border-radius:4px;font-size:11px;">${weights.difficulty}</span></td></tr>`;
      }
      if (weights.knowledge_priority && weights.knowledge_priority.length > 0) {
        impactHtml += `
          <tr><td style="padding:6px 0;color:#7c3aed;width:100px;">📖 优先知识点</td>
          <td style="padding:6px 0;">${weights.knowledge_priority.map(t => `<span style="display:inline-block;padding:2px 8px;background:#ede9fe;color:#7c3aed;border-radius:4px;margin:1px;font-size:11px;">${t}</span>`).join('')}</td></tr>`;
      }
      if (weights.pace_advice) {
        impactHtml += `
          <tr><td style="padding:6px 0;color:#e11d48;width:100px;">🏃 学习节奏</td>
          <td style="padding:6px 0;color:#333;">${escapeHtml(weights.pace_advice)}</td></tr>`;
      }

      impactHtml += `</table></div>`;
    }

    if (adopted.length === 0) {
      list.innerHTML = '<p style="color:#aaa;font-size:13px;text-align:center;padding:12px;">暂无已采纳的建议</p>';
      return;
    }

    const typeNames = {
      'resource_adjustment': '📚 资源调整',
      'difficulty_adjustment': '⚡ 难度调整',
      'knowledge_priority': '📖 知识点优先级',
      'pace_advice': '🏃 节奏建议'
    };

    list.innerHTML = impactHtml + adopted.map(s => `
      <div class="adj-box" style="margin-bottom:10px;padding:12px;border-left:4px solid #11998e;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
          <span style="font-size:13px;font-weight:600;color:#11998e;">${typeNames[s.type] || s.type}</span>
          <span style="font-size:11px;color:#888;">权重: ${s.weight || 0.7}</span>
        </div>
        <div style="font-size:13px;color:#333;margin-bottom:6px;">${escapeHtml(s.content)}</div>
        <div style="font-size:11px;color:#aaa;">${formatTime(s.adopted_at)}</div>
        <div style="margin-top:6px;">
          <button onclick="rejectSuggestion('${s.type}','${escapeHtml(s.content)}')" style="padding:4px 10px;background:#fff0f0;color:#e74c3c;border:1px solid #e74c3c;border-radius:4px;cursor:pointer;font-size:11px;">撤销</button>
        </div>
      </div>
    `).join('');
  } catch (e) {
    console.error('加载已采纳建议失败:', e);
  }
}

function formatTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
}

async function adoptSuggestion(type, content, btn) {
  const weight = prompt('请输入采纳权重 (0.0~1.0，默认0.7)：', '0.7');
  if (weight === null) return;
  const w = parseFloat(weight);
  if (isNaN(w) || w < 0 || w > 1) {
    alert('请输入 0.0~1.0 之间的数值');
    return;
  }

  if (btn) { btn.disabled = true; btn.textContent = '采纳中...'; }

  try {
    const resp = await fetch(`/assessment/adopt/${getUserId()}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ suggestion_type: type, content: content, weight: w })
    });
    const data = await resp.json();
    if (data.success) {
      alert(`✅ 已采纳该建议 (权重: ${w})`);
      loadLatest();
    } else {
      alert('采纳失败');
    }
  } catch (e) {
    alert('采纳失败: ' + e.message);
  }
  if (btn) { btn.disabled = false; btn.textContent = '✅ 采纳'; }
}

async function rejectSuggestion(type, content) {
  if (!confirm('确定要撤销这条已采纳的建议吗？')) return;

  try {
    const resp = await fetch(`/assessment/reject/${getUserId()}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ suggestion_type: type, content: content })
    });
    const data = await resp.json();
    if (data.success) {
      loadLatest();
    } else {
      alert('撤销失败');
    }
  } catch (e) {
    alert('撤销失败: ' + e.message);
  }
}

async function applyAdjustments() {
  const btn = document.querySelector('.btn-apply');
  btn.disabled = true;
  btn.textContent = '应用中...';

  try {
    const resp = await fetch(`/assessment/apply/${getUserId()}`, { method: 'POST' });
    const data = await resp.json();
    if (data.success) {
      alert('✅ 调整建议已应用');
      loadLatest();
    } else {
      alert('应用失败');
    }
  } catch (e) {
    alert('应用失败: ' + e.message);
  }
  btn.disabled = false;
  btn.textContent = '🔄 应用调整建议';
}

async function reRegeneratePart(partType, index) {
  const confirmMsg = {
    'dimension': `确定要重新评估第 ${index + 1} 个维度吗？`,
    'weak_point': `确定要重新识别第 ${index + 1} 个薄弱点吗？`,
    'overall': '确定要重新评估总体等级吗？'
  };
  
  if (!confirm(confirmMsg[partType] || '确定要重新生成这部分吗？')) {
    return;
  }

  const btns = document.querySelectorAll('.btn-regen');
  btns.forEach(btn => btn.disabled = true);

  try {
    const resp = await fetch(`/assessment/regenerate/${getUserId()}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ 
        assessment_id: currentAssessmentId,
        part_type: partType, 
        part_index: index 
      })
    });
    const data = await resp.json();

    if (data.success && data.assessment) {
      alert(`✅ 已重新生成${getPartTypeName(partType)}`);
      renderAssessment(data.assessment);
    } else {
      alert('重新生成失败: ' + (data.message || '未知错误'));
    }
  } catch (e) {
    alert('重新生成失败: ' + e.message);
  }

  btns.forEach(btn => btn.disabled = false);
}

function getPartTypeName(type) {
  const names = {
    'dimension': '维度评估',
    'weak_point': '薄弱点',
    'suggestion': '建议',
    'overall': '总体评估'
  };
  return names[type] || type;
}

function escapeHtml(s) {
  if (!s) return '';
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// ==================== 可视化渲染 ====================
function renderVisualizations(a) {
  const dims = a.dimensions || [];
  const weak = a.weak_points || [];
  
  // 1. 渲染进度条
  renderProgressBars(dims);
  
  // 2. 渲染雷达图
  renderRadarChart(dims);
  
  // 3. 渲染薄弱点热力图
  renderHeatmap(weak);
}

function renderProgressBars(dims) {
  const container = document.getElementById('progressBars');
  if (!container || !dims.length) return;
  
  container.innerHTML = dims.map(d => {
    const ds = d.score || 0;
    const dc = ds >= 80 ? '#00b894' : ds >= 60 ? '#fdcb6e' : '#e74c3c';
    return `
      <div class="progress-bar-wrapper">
        <div class="progress-bar-label">
          <span class="pb-name">${escapeHtml(d.name || '')}</span>
          <span class="pb-score" style="color:${dc}">${ds}</span>
        </div>
        <div class="progress-bar-track">
          <div class="progress-bar-fill" style="width:${ds}%;background:${dc}"></div>
        </div>
      </div>
    `;
  }).join('');
}

function renderRadarChart(dims) {
  const canvas = document.getElementById('radarChart');
  if (!canvas || !dims.length) return;
  
  // 销毁旧图表
  if (window._radarChart) {
    window._radarChart.destroy();
  }
  
  const labels = dims.map(d => d.name || '');
  const scores = dims.map(d => d.score || 0);
  
  window._radarChart = new Chart(canvas, {
    type: 'radar',
    data: {
      labels: labels,
      datasets: [{
        label: '当前得分',
        data: scores,
        backgroundColor: 'rgba(0, 184, 148, 0.2)',
        borderColor: '#00b894',
        borderWidth: 2,
        pointBackgroundColor: scores.map(s => s >= 80 ? '#00b894' : s >= 60 ? '#fdcb6e' : '#e74c3c'),
        pointBorderColor: '#fff',
        pointBorderWidth: 1,
        pointRadius: 4
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        r: {
          min: 0,
          max: 100,
          ticks: { stepSize: 20, font: { size: 10 } },
          pointLabels: { font: { size: 11 } },
          grid: { color: 'rgba(0,0,0,0.08)' },
          angleLines: { color: 'rgba(0,0,0,0.08)' }
        }
      },
      plugins: {
        legend: { display: false }
      }
    }
  });
}

function renderHeatmap(weak) {
  const container = document.getElementById('heatmapContainer');
  if (!container) return;
  
  if (!weak.length) {
    container.innerHTML = '<p style="color:#aaa;font-size:13px;text-align:center;padding:12px;">暂无薄弱点</p>';
    return;
  }
  
  const priorityColors = {
    '高': { bg: '#fef2f2', bar: '#e74c3c', text: '#dc2626' },
    '中': { bg: '#fffbeb', bar: '#f59e0b', text: '#d97706' },
    '低': { bg: '#f0fdf4', bar: '#22c55e', text: '#16a34a' }
  };
  
  // 按优先级排序
  const order = { '高': 0, '中': 1, '低': 2 };
  const sorted = [...weak].sort((a, b) => (order[a.priority] || 99) - (order[b.priority] || 99));
  
  container.innerHTML = sorted.map(w => {
    const pc = priorityColors[w.priority] || priorityColors['中'];
    const severity = w.priority === '高' ? 90 : w.priority === '中' ? 60 : 30;
    return `
      <div class="heatmap-item" style="background:${pc.bg}">
        <span class="hm-point" style="color:${pc.text}">${escapeHtml(w.point || '')}</span>
        <div class="hm-bar" style="background:${pc.bar};width:${severity}%;opacity:0.7;"></div>
        <span class="hm-priority" style="color:${pc.text}">${w.priority || '中'}优先级</span>
      </div>
    `;
  }).join('');
}

// ==================== 通知功能 ====================
async function checkNotifications() {
  try {
    const resp = await fetch(`/assessment/notifications/${getUserId()}`);
    const data = await resp.json();
    if (!data.success) return;
    
    const badge = document.getElementById('notifBadge');
    const dot = document.getElementById('notifDot');
    const count = document.getElementById('notifCount');
    
    const unread = data.unread_count || 0;
    if (unread > 0) {
      badge.style.display = 'inline-flex';
      dot.style.display = 'inline-block';
      count.textContent = unread;
    } else {
      badge.style.display = 'none';
    }
  } catch (e) {
    // 静默失败
  }
}

async function showNotifications() {
  try {
    const resp = await fetch(`/assessment/notifications/${getUserId()}`);
    const data = await resp.json();
    if (!data.success) return;
    
    const list = document.getElementById('notifList');
    const notifications = data.notifications || [];
    
    if (!notifications.length) {
      list.innerHTML = '<p style="color:#888;font-size:13px;text-align:center;">暂无通知</p>';
      return;
    }
    
    list.innerHTML = notifications.map(n => `
      <div style="padding:12px;border-radius:8px;background:${n.read ? '#f8f9fa' : '#f0fdf4'};margin-bottom:8px;text-align:left;">
        <div style="display:flex;justify-content:space-between;">
          <strong style="font-size:14px;color:#333;">${escapeHtml(n.title)}</strong>
          ${!n.read ? '<span class="notif-dot" style="width:6px;height:6px;"></span>' : ''}
        </div>
        <div style="font-size:13px;color:#555;margin-top:6px;line-height:1.5;">${escapeHtml(n.content)}</div>
        <div style="font-size:11px;color:#aaa;margin-top:6px;">${formatTime(n.timestamp)}</div>
        <button onclick="markNotifRead('${escapeHtml(n.assessment_id)}')" style="margin-top:6px;padding:3px 10px;border:1px solid #00b894;border-radius:6px;background:transparent;color:#00b894;cursor:pointer;font-size:11px;">标记已读</button>
      </div>
    `).join('');
    
    document.getElementById('notifModal').style.display = 'flex';
    
    // 标记已读
    await fetch(`/assessment/notifications/${getUserId()}/read`, { method: 'POST' });
    checkNotifications();
  } catch (e) {
    alert('获取通知失败');
  }
}

async function markNotifRead(assessmentId) {
  try {
    await fetch(`/assessment/notifications/${getUserId()}/read`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ assessment_id: assessmentId })
    });
    showNotifications();
  } catch (e) {}
}

// 在 renderAssessment 中自动调用可视化
const _origRender = renderAssessment;
renderAssessment = function(a) {
  _origRender(a);
  
  // 使用 setTimeout 确保 DOM 渲染完成
  setTimeout(() => {
    renderVisualizations(a);
    checkNotifications();
  }, 100);
  
  // ★★★ 将评估报告发给父窗口，供悬浮球智能学伴获取上下文 ★★★
  try {
    const assessmentContext = {
      overall_score: a.overall_score || (a.overall && a.overall.score) || 0,
      overall_level: a.overall_level || (a.overall && a.overall.status) || '',
      overall_summary: a.overall_summary || (a.overall && a.overall.summary) || '',
      weak_points_count: (a.weak_points || []).length,
      dimensions_count: (a.dimensions || []).length,
      has_assessment: true,
      assessment_id: a.assessment_id || ''
    };
    window.parent.postMessage({
      type: 'pageContext',
      page: 'assessment',
      title: '学习评估',
      action: 'viewing',
      detail: JSON.stringify(assessmentContext)
    }, '*');
  } catch(e) {}
}

window.addEventListener('message', function(e){
  if(e.data&&e.data.type==='setUserId'){
    var inp=document.getElementById('userId');
    if(inp)inp.value=e.data.userId;
  }
});

loadLatest();
</script>
