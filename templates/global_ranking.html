<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全局排行榜 - 智能教育系统</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
               background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh;
               padding: 20px; }
        
        .container { max-width: 1200px; margin: 0 auto; }
        
        .header { text-align: center; color: white; margin-bottom: 30px; }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        .header p { font-size: 1.1em; opacity: 0.9; }
        
        .main-panel { background: white; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); overflow: hidden; }
        
        .search-bar { padding: 20px 30px; background: #f8f9fa; border-bottom: 1px solid #e0e0e0; display: flex; gap: 15px; align-items: center; }
        .search-bar input { flex: 1; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 14px; outline: none; transition: border-color 0.2s; }
        .search-bar input:focus { border-color: #667eea; }
        .search-bar button { padding: 12px 24px; border: none; border-radius: 10px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; font-weight: 600; cursor: pointer; transition: transform 0.2s; }
        .search-bar button:hover { transform: translateY(-2px); }
        
        .user-filter { padding: 15px 30px; background: #fff; border-bottom: 1px solid #e0e0e0; display: flex; gap: 15px; align-items: center; }
        .user-filter label { font-weight: 600; color: #333; }
        .user-filter input { padding: 8px 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 13px; outline: none; }
        .user-filter input:focus { border-color: #667eea; }
        
        .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; padding: 20px 30px; background: #fff; border-bottom: 1px solid #e0e0e0; }
        .stat-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 12px; padding: 15px 20px; color: white; text-align: center; }
        .stat-card .value { font-size: 28px; font-weight: 700; }
        .stat-card .label { font-size: 13px; opacity: 0.9; margin-top: 4px; }
        
        .weights-info { padding: 15px 30px; background: #f0f7ff; border-bottom: 1px solid #e0e0e0; display: flex; flex-wrap: wrap; gap: 20px; align-items: center; }
        .weights-info .title { font-weight: 600; color: #333; }
        .weight-tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; background: #fff; border-radius: 20px; font-size: 13px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .weight-tag .name { font-weight: 600; color: #667eea; }
        .weight-tag .value { color: #333; }
        
        .ranking-header { display: grid; grid-template-columns: 80px 150px 120px repeat(4, 100px) 120px; padding: 15px 30px; background: #f8f9fa; font-weight: 600; color: #666; font-size: 13px; border-bottom: 2px solid #667eea; }
        .ranking-header > div { display: flex; align-items: center; }
        
        .ranking-list { max-height: 500px; overflow-y: auto; }
        .ranking-item { display: grid; grid-template-columns: 80px 150px 120px repeat(4, 100px) 120px; padding: 15px 30px; border-bottom: 1px solid #f0f0f0; transition: background 0.2s; cursor: pointer; }
        .ranking-item:hover { background: #f8f9ff; }
        .ranking-item.current-user { background: #fff3cd; border-left: 4px solid #ffc107; }
        .ranking-item.current-user:hover { background: #fff9e6; }
        
        .rank-badge { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; }
        .rank-badge.gold { background: linear-gradient(135deg, #ffd700 0%, #ffb700 100%); color: #8b6914; }
        .rank-badge.silver { background: linear-gradient(135deg, #c0c0c0 0%, #a0a0a0 100%); color: #4a4a4a; }
        .rank-badge.bronze { background: linear-gradient(135deg, #cd7f32 0%, #b87333 100%); color: #5c3d1e; }
        .rank-badge.normal { background: #e0e0e0; color: #666; }
        
        .user-name { font-weight: 600; color: #333; }
        
        .score-value { font-weight: 700; color: #667eea; font-size: 16px; }
        
        .dimension-bar { height: 20px; background: #e0e0e0; border-radius: 10px; overflow: hidden; position: relative; }
        .dimension-fill { height: 100%; border-radius: 10px; transition: width 0.5s ease; }
        .dimension-fill.coding { background: linear-gradient(90deg, #667eea, #764ba2); }
        .dimension-fill.accuracy { background: linear-gradient(90deg, #10b981, #059669); }
        .dimension-fill.time { background: linear-gradient(90deg, #f59e0b, #d97706); }
        .dimension-fill.count { background: linear-gradient(90deg, #ec4899, #db2777); }
        .dimension-text { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); font-size: 11px; font-weight: 600; color: white; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        
        .submission-info { font-size: 12px; color: #666; }
        
        .loading-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); display: none; align-items: center; justify-content: center; z-index: 100; }
        .loading-overlay.show { display: flex; }
        .loading-spinner { width: 48px; height: 48px; border: 4px solid #f0f0f0; border-top-color: #667eea; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .pagination { padding: 20px 30px; display: flex; justify-content: center; gap: 10px; border-top: 1px solid #e0e0e0; }
        .pagination button { padding: 10px 20px; border: 2px solid #e0e0e0; border-radius: 8px; background: white; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .pagination button:hover { border-color: #667eea; color: #667eea; }
        .pagination button.active { background: #667eea; color: white; border-color: #667eea; }
        .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .detail-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; display: none; align-items: center; justify-content: center; }
        .detail-modal.show { display: flex; }
        .detail-modal .modal-content { background: white; border-radius: 16px; padding: 30px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .detail-modal .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .detail-modal .modal-header h2 { color: #333; }
        .detail-modal .close-btn { width: 32px; height: 32px; border: none; border-radius: 50%; background: #f0f0f0; font-size: 20px; cursor: pointer; }
        .detail-modal .detail-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
        .detail-modal .detail-row .label { color: #666; font-weight: 500; }
        .detail-modal .detail-row .value { color: #333; font-weight: 600; }
        .detail-modal .chart-container { height: 250px; margin-top: 20px; }
        
        .empty-state { text-align: center; padding: 60px 30px; color: #999; }
        .empty-state .icon { font-size: 64px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏆 全局用户排行榜</h1>
            <p>综合评价编程能力、准确率、学习时长、做题数量和综合特征</p>
        </div>
        
        <div class="main-panel" id="mainPanel">
            <div class="user-filter">
                <label>当前用户ID:</label>
                <input type="text" id="currentUserId" placeholder="输入用户ID查看排名" value="user_001">
                <button onclick="loadRanking()">查询</button>
            </div>
            
            <div class="stats-row" id="statsRow" style="display: none;">
                <div class="stat-card">
                    <div class="value" id="totalUsers">-</div>
                    <div class="label">总用户数</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="userRank">-</div>
                    <div class="label">我的排名</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="userScore">-</div>
                    <div class="label">我的分数</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="topScore">-</div>
                    <div class="label">最高分</div>
                </div>
            </div>
            
            <div class="weights-info" id="weightsInfo" style="display: none;">
                <span class="title">评分权重:</span>
                <div class="weight-tag"><span class="name">编程能力</span><span class="value" id="wCoding">-</span></div>
                <div class="weight-tag"><span class="name">准确率</span><span class="value" id="wAccuracy">-</span></div>
                <div class="weight-tag"><span class="name">学习时长</span><span class="value" id="wTime">-</span></div>
                <div class="weight-tag"><span class="name">做题数量</span><span class="value" id="wCount">-</span></div>
                <div class="weight-tag"><span class="name">综合特征</span><span class="value" id="wFeature">-</span></div>
            </div>
            
            <div class="ranking-header">
                <div>排名</div>
                <div>用户ID</div>
                <div>综合分数</div>
                <div>编程能力</div>
                <div>准确率</div>
                <div>学习时长</div>
                <div>做题数量</div>
                <div>提交统计</div>
            </div>
            
            <div class="ranking-list" id="rankingList">
                <div class="empty-state">
                    <div class="icon">📊</div>
                    <div>点击查询按钮加载排行榜</div>
                </div>
            </div>
            
            <div class="pagination" id="pagination" style="display: none;">
                <button onclick="prevPage()" id="prevBtn" disabled>上一页</button>
                <span id="pageInfo">第 1 页</span>
                <button onclick="nextPage()" id="nextBtn" disabled>下一页</button>
            </div>
            
            <div class="loading-overlay" id="loadingOverlay">
                <div class="loading-spinner"></div>
            </div>
        </div>
    </div>
    
    <div class="detail-modal" id="detailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>用户详情 - <span id="detailUserId"></span></h2>
                <button class="close-btn" onclick="closeDetail()">×</button>
            </div>
            <div id="detailContent"></div>
            <div class="chart-container" id="radarChart"></div>
        </div>
    </div>
    
    <script>
        let currentPage = 1;
        let totalPages = 1;
        let allRankings = [];
        let weights = {};
        
        async function loadRanking() {
            const userId = document.getElementById('currentUserId').value.trim();
            const loading = document.getElementById('loadingOverlay');
            const list = document.getElementById('rankingList');
            
            loading.classList.add('show');
            
            try {
                const url = `/api/global-ranking?limit=50${userId ? `&user_id=${encodeURIComponent(userId)}` : ''}`;
                const response = await fetch(url);
                const result = await response.json();
                
                if (result.success) {
                    allRankings = result.rankings;
                    currentPage = 1;
                    totalPages = Math.ceil(allRankings.length / 10);
                    
                    updateStats(result);
                    updateWeights(result.weights);
                    renderPage();
                    updatePagination();
                } else {
                    list.innerHTML = '<div class="empty-state"><div class="icon">❌</div><div>加载失败: ' + (result.error || '未知错误') + '</div></div>';
                }
            } catch (error) {
                list.innerHTML = '<div class="empty-state"><div class="icon">❌</div><div>网络错误: ' + error.message + '</div></div>';
            } finally {
                loading.classList.remove('show');
            }
        }
        
        function updateStats(result) {
            document.getElementById('statsRow').style.display = 'grid';
            document.getElementById('totalUsers').textContent = result.total_users;
            document.getElementById('userRank').textContent = result.user_rank || '-';
            document.getElementById('userScore').textContent = '-';
            document.getElementById('topScore').textContent = allRankings.length > 0 ? allRankings[0].composite_score : '-';
            
            const userId = document.getElementById('currentUserId').value.trim();
            if (userId) {
                const userData = allRankings.find(r => r.user_id === userId);
                if (userData) {
                    document.getElementById('userScore').textContent = userData.composite_score;
                }
            }
        }
        
        function updateWeights(w) {
            if (!w) return;
            weights = w;
            document.getElementById('weightsInfo').style.display = 'flex';
            document.getElementById('wCoding').textContent = (w.coding_score * 100).toFixed(0) + '%';
            document.getElementById('wAccuracy').textContent = (w.accuracy_score * 100).toFixed(0) + '%';
            document.getElementById('wTime').textContent = (w.learning_time_score * 100).toFixed(0) + '%';
            document.getElementById('wCount').textContent = (w.problem_count_score * 100).toFixed(0) + '%';
            document.getElementById('wFeature').textContent = (w.overall_feature_score * 100).toFixed(0) + '%';
        }
        
        function renderPage() {
            const list = document.getElementById('rankingList');
            const userId = document.getElementById('currentUserId').value.trim();
            const start = (currentPage - 1) * 10;
            const end = start + 10;
            const pageData = allRankings.slice(start, end);
            
            if (pageData.length === 0) {
                list.innerHTML = '<div class="empty-state"><div class="icon">📭</div><div>暂无数据</div></div>';
                return;
            }
            
            let html = '';
            pageData.forEach(item => {
                const isCurrentUser = userId && item.user_id === userId;
                const rankClass = item.rank === 1 ? 'gold' : item.rank === 2 ? 'silver' : item.rank === 3 ? 'bronze' : 'normal';
                
                html += `
                    <div class="ranking-item${isCurrentUser ? ' current-user' : ''}" onclick="showDetail('${item.user_id}')">
                        <div><div class="rank-badge ${rankClass}">${item.rank}</div></div>
                        <div class="user-name">${item.user_id}</div>
                        <div class="score-value">${item.composite_score}</div>
                        <div><div class="dimension-bar"><div class="dimension-fill coding" style="width: ${item.dimension_scores.coding_score}%"><span class="dimension-text">${item.dimension_scores.coding_score}</span></div></div></div>
                        <div><div class="dimension-bar"><div class="dimension-fill accuracy" style="width: ${item.dimension_scores.accuracy_score}%"><span class="dimension-text">${item.dimension_scores.accuracy_score}</span></div></div></div>
                        <div><div class="dimension-bar"><div class="dimension-fill time" style="width: ${item.dimension_scores.learning_time_score}%"><span class="dimension-text">${item.dimension_scores.learning_time_score}</span></div></div></div>
                        <div><div class="dimension-bar"><div class="dimension-fill count" style="width: ${item.dimension_scores.problem_count_score}%"><span class="dimension-text">${item.dimension_scores.problem_count_score}</span></div></div></div>
                        <div class="submission-info">${item.submission_stats.total_submissions}次提交<br/>${item.submission_stats.accepted_count}次通过</div>
                    </div>
                `;
            });
            
            list.innerHTML = html;
        }
        
        function updatePagination() {
            const pagination = document.getElementById('pagination');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const pageInfo = document.getElementById('pageInfo');
            
            if (totalPages <= 1) {
                pagination.style.display = 'none';
                return;
            }
            
            pagination.style.display = 'flex';
            prevBtn.disabled = currentPage === 1;
            nextBtn.disabled = currentPage === totalPages;
            pageInfo.textContent = `第 ${currentPage} / ${totalPages} 页`;
        }
        
        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                renderPage();
                updatePagination();
            }
        }
        
        function nextPage() {
            if (currentPage < totalPages) {
                currentPage++;
                renderPage();
                updatePagination();
            }
        }
        
        async function showDetail(userId) {
            const modal = document.getElementById('detailModal');
            const detailContent = document.getElementById('detailContent');
            const detailUserId = document.getElementById('detailUserId');
            
            detailUserId.textContent = userId;
            detailContent.innerHTML = '<div class="loading-overlay show" style="position: relative;"><div class="loading-spinner"></div></div>';
            
            modal.classList.add('show');
            
            try {
                const response = await fetch(`/api/global-ranking/user/${encodeURIComponent(userId)}`);
                const result = await response.json();
                
                if (result.success && result.rank !== undefined) {
                    const d = result.dimension_scores;
                    const s = result.submission_stats;
                    
                    detailContent.innerHTML = `
                        <div class="detail-row"><span class="label">排名</span><span class="value">#${result.rank}</span></div>
                        <div class="detail-row"><span class="label">综合分数</span><span class="value">${result.composite_score}</span></div>
                        <div class="detail-row"><span class="label">编程能力分</span><span class="value">${d.coding_score}</span></div>
                        <div class="detail-row"><span class="label">准确率分</span><span class="value">${d.accuracy_score}%</span></div>
                        <div class="detail-row"><span class="label">学习时长分</span><span class="value">${d.learning_time_score}</span></div>
                        <div class="detail-row"><span class="label">做题数量分</span><span class="value">${d.problem_count_score}</span></div>
                        <div class="detail-row"><span class="label">综合特征分</span><span class="value">${d.overall_feature_score}</span></div>
                        <div class="detail-row"><span class="label">总提交次数</span><span class="value">${s.total_submissions}</span></div>
                        <div class="detail-row"><span class="label">通过次数</span><span class="value">${s.accepted_count}</span></div>
                        <div class="detail-row"><span class="label">平均得分</span><span class="value">${s.avg_score}</span></div>
                    `;
                    
                    renderRadarChart(d);
                } else {
                    detailContent.innerHTML = '<div class="empty-state"><div>用户不存在或无数据</div></div>';
                }
            } catch (error) {
                detailContent.innerHTML = '<div class="empty-state"><div>加载失败: ' + error.message + '</div></div>';
            }
        }
        
        function closeDetail() {
            document.getElementById('detailModal').classList.remove('show');
        }
        
        function renderRadarChart(dimensionScores) {
            const chartDom = document.getElementById('radarChart');
            const chart = echarts.init(chartDom);
            
            const option = {
                tooltip: { trigger: 'item' },
                radar: {
                    indicator: [
                        { name: '编程能力', max: 100 },
                        { name: '准确率', max: 100 },
                        { name: '学习时长', max: 100 },
                        { name: '做题数量', max: 100 },
                        { name: '综合特征', max: 100 }
                    ],
                    shape: 'polygon',
                    splitNumber: 5,
                    axisName: { color: '#666', fontSize: 12 },
                    splitArea: { areaStyle: { color: ['#fff', '#f8f9fa'] } },
                    axisLine: { lineStyle: { color: '#ddd' } },
                    splitLine: { lineStyle: { color: '#ddd' } }
                },
                series: [{
                    type: 'radar',
                    data: [{
                        value: [
                            dimensionScores.coding_score,
                            dimensionScores.accuracy_score,
                            dimensionScores.learning_time_score,
                            dimensionScores.problem_count_score,
                            dimensionScores.overall_feature_score
                        ],
                        name: '各维度得分',
                        areaStyle: { color: 'rgba(102, 126, 234, 0.2)' },
                        lineStyle: { color: '#667eea', width: 2 },
                        itemStyle: { color: '#667eea' }
                    }]
                }]
            };
            
            chart.setOption(option);
        }
        
        document.getElementById('currentUserId').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') loadRanking();
        });
        
        window.addEventListener('message', function(e) {
            if (e.data && e.data.type === 'setUserId') {
                const userId = e.data.userId || 'user_001';
                document.getElementById('currentUserId').value = userId;
                loadRanking();
            }
        });
    </script>
</body>
</html>
