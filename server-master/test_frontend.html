<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
</head>
<body>
    <h1>Testing API Response</h1>
    <div id="result"></div>
    
    <script>
        fetch('/api/algorithms')
            .then(response => {
                console.log('Status:', response.status);
                console.log('Headers:', response.headers);
                return response.text();
            })
            .then(text => {
                console.log('Response text (first 200 chars):', text.substring(0, 200));
                document.getElementById('result').innerHTML = `
                    <h2>First 500 characters:</h2>
                    <pre>${text.substring(0, 500)}</pre>
                `;
                
                // Try to parse as JSON
                try {
                    const json = JSON.parse(text);
                    console.log('Successfully parsed as JSON');
                    document.getElementById('result').innerHTML += '<h2 style="color: green;">✅ Valid JSON!</h2>';
                } catch (e) {
                    console.error('Failed to parse as JSON:', e);
                    document.getElementById('result').innerHTML += `<h2 style="color: red;">❌ Not valid JSON: ${e.message}</h2>`;
                }
            })
            .catch(error => {
                console.error('Fetch error:', error);
                document.getElementById('result').innerHTML += `<h2 style="color: red;">Error: ${error.message}</h2>`;
            });
    </script>
</body>
</html>
